<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3DBE6B">
<title>FurSight</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
  :root {
    --fern: #3DBE6B; --fern-lip: #2A9A52; --sun: #FFB627; --sun-lip: #D9900A; --coral: #FF4D5E; --coral-lip: #D93545;
    --sky: #2FA8F5; --sky-lip: #1E86C9; --grape: #9B6CF0; --grape-lip: #7A4ED1;
    --ink: #2B2A33; --muted: #6B6977; --line: #E4E1EA; --bg: #F6F5F9; --card: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 700 16px/1.45 Nunito, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }
  h1, h2, h3 { font-weight: 900; margin: 0; letter-spacing: -0.01em; }
  h1 { font-size: 30px; } h2 { font-size: 22px; } h3 { font-size: 17px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .stack > * + * { margin-top: 14px; }

  /* chunky cards and buttons with a lip, like keys */
  .card { background: var(--card); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 20px; padding: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 12px 18px;
         border: 0; border-radius: 16px; font: 900 17px Nunito, sans-serif; color: var(--ink); background: var(--fern); box-shadow: 0 5px 0 var(--fern-lip);
         cursor: pointer; transition: transform .08s, box-shadow .08s; text-decoration: none; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--fern-lip); }
  .btn.sky { background: var(--sky); box-shadow: 0 5px 0 var(--sky-lip); } .btn.sky:active { box-shadow: 0 1px 0 var(--sky-lip); }
  /* text stays readable: ink on the bright fills, white only on a deeper grape */
  .btn.grape { background: var(--grape-lip); color: #fff; box-shadow: 0 5px 0 #5B35A8; } .btn.grape:active { box-shadow: 0 1px 0 #5B35A8; }
  .btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
  .btn.ghost:active { box-shadow: 0 0 0 var(--line); }
  .btn.small { min-height: 42px; width: auto; font-size: 15px; padding: 8px 14px; border-radius: 13px; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  label { display: block; font-weight: 900; font-size: 14px; margin-bottom: 6px; }
  input, textarea, select { width: 100%; font: 800 16px Nunito, sans-serif; color: var(--ink); background: var(--card); border: 2px solid var(--line);
         border-radius: 14px; padding: 12px 14px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--sky); }
  textarea { min-height: 80px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; } .row > * { flex: 1; min-width: 0; }

  /* top bar + pet header */
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; }
  .pet { display: flex; gap: 14px; align-items: center; }
  .pet img, .pet .ph { width: 76px; height: 76px; border-radius: 22px; object-fit: cover; background: var(--line); border: 3px solid var(--card); box-shadow: 0 4px 0 var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 13px; font-weight: 900; padding: 3px 10px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); color: var(--muted); }

  /* bottom tabs */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 2px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
  nav .in { max-width: 560px; margin: 0 auto; display: flex; gap: 6px; }
  nav button { flex: 1; border: 0; background: none; font: 900 13px Nunito, sans-serif; color: var(--muted); padding: 6px 0; border-radius: 12px; cursor: pointer; }
  nav button svg { display: block; margin: 0 auto 2px; }
  nav button.on { color: var(--sky); background: #EAF6FE; }

  /* diary */
  .entry { display: flex; gap: 12px; align-items: flex-start; }
  .del { border: 0; background: none; padding: 0; font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .del:hover { color: var(--coral-lip); } .recap .del { margin-top: 8px; justify-self: start; }
  .entry img { width: 76px; height: 76px; object-fit: cover; border-radius: 14px; flex: none; background: var(--line); }
  /* a cut-out sticker is shown whole, bigger, with no tile behind it */
  .entry img, .recap img, .livecardbox { cursor: zoom-in; }
  .lvl { display: grid; gap: 4px; } .lvbar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; } .lvbar i { display: block; height: 100%; border-radius: 6px; transition: width .6s; }
  .livecard { gap: 16px; align-items: center; } .livecard .lxcap { display: grid; gap: 2px; } .livecard .lxcap b { font-size: 19px; } .livecard .lxcap span { color: var(--muted); font-size: 14px; }
  .lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(20,19,26,.86); display: grid; place-items: center; padding: 20px; animation: lbIn .18s ease-out; cursor: zoom-out; }
  .lightbox.out { opacity: 0; transition: opacity .18s; }
  .lightbox img { max-width: min(100%, 900px); max-height: 86vh; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .lightbox img.sticker { border-radius: 0; box-shadow: none; filter: drop-shadow(0 12px 24px rgba(0,0,0,.35)); }
  .lightbox button { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; color: var(--ink); font: 900 18px Nunito, sans-serif; }
  @keyframes lbIn { from { opacity: 0; transform: scale(.97); } }
  .entry img.sticker { width: 96px; height: 96px; object-fit: contain; border-radius: 0; background: none; filter: drop-shadow(0 3px 5px rgba(0,0,0,.18)); }
  .badge { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--ink); font-weight: 900; }
  .v-safe { background: var(--fern); box-shadow: 0 3px 0 var(--fern-lip); } .v-caution { background: var(--sun); box-shadow: 0 3px 0 var(--sun-lip); }
  .v-toxic, .v-vet { background: var(--coral); box-shadow: 0 3px 0 var(--coral-lip); } .v-other { background: var(--sky); box-shadow: 0 3px 0 var(--sky-lip); }
  .vword { font-weight: 900; font-size: 14px; }
  .t-safe { color: var(--fern-lip); } .t-caution { color: var(--sun-lip); } .t-toxic, .t-vet { color: var(--coral); } .t-other { color: var(--sky-lip); }
  .when { font-size: 13px; color: var(--muted); }
  .day { font-weight: 900; color: var(--muted); font-size: 14px; margin: 18px 4px 8px; text-transform: uppercase; letter-spacing: .04em; }

  /* care plan */
  .care h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .care ul { margin: 0; padding-left: 20px; } .care li { margin: 3px 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

  /* link code */
  .code { font-size: 44px; font-weight: 900; letter-spacing: .18em; text-align: center; padding: 10px 0; }
  .codein { font-size: 32px; text-align: center; letter-spacing: .3em; text-transform: uppercase; font-weight: 900; }

  /* camera */
  .cam { position: relative; border-radius: 18px; overflow: hidden; background: #111; aspect-ratio: 1; }
  .cam video, .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .live { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .live b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); margin-right: 6px; }

  .check { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 2px solid var(--line); cursor: pointer; }
  .check:last-child { border-bottom: 0; }
  .box { width: 30px; height: 30px; flex: none; border-radius: 10px; border: 3px solid var(--line); display: grid; place-items: center; transition: transform .12s; }
  .check.done .box { background: var(--fern); border-color: var(--fern); box-shadow: 0 3px 0 var(--fern-lip); }
  .check.done .box::after { content: ""; width: 12px; height: 7px; border: 4px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -2px); }
  .check.done span { color: var(--muted); text-decoration: line-through; }
  .check:active .box { transform: scale(.9); }
  .streak { display: flex; align-items: center; gap: 10px; }
  .flame { font-size: 30px; font-weight: 900; color: var(--sun-lip); }
  .bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--fern); border-radius: 6px; transition: width .3s; }
  .row > svg.bean { flex: none; }
  .hz { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hz i { width: 26px; height: 26px; border-radius: 50%; color: var(--ink); font-style: normal; font-weight: 900; display: grid; place-items: center; }
  .moment { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
  .moment.noimg { grid-template-columns: 1fr; }
  .moment.sticker img { object-fit: contain; border-radius: 0; transform: rotate(-4deg); }
  .moment img { width: 96px; height: 96px; object-fit: cover; border-radius: 14px; }
  table.act { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.act th { font-size: 12px; color: var(--muted); text-align: right; font-weight: 900; }
  table.act td { padding: 6px 0; border-top: 1px solid var(--line); text-align: right; } table.act td:first-child { text-align: left; font-weight: 800; }
  .routine { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .routine small { display: block; font-size: 12px; line-height: 1.3; margin-top: 2px; }
  .routine .btn.small { width: auto; min-height: 40px; padding: 6px 14px; font-size: 14px; }
  .routine .x { border: 0; background: none; color: var(--muted); font: 900 20px Nunito, sans-serif; cursor: pointer; padding: 4px; }
  .addr summary { cursor: pointer; font-weight: 900; color: var(--grape-lip); }
  .tray { display: grid; gap: 10px; }
  .idea { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
  .idea p { font-size: 14px; margin-top: 2px; } .idea small { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .room { border-radius: 14px; padding: 10px 12px; background: var(--bg); font-size: 14px; } .room b { font-size: 18px; }
  .room.watch { background: #FFF2D6; } .room.vet { background: #FFE6E8; color: var(--coral-lip); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { display: grid; gap: 2px; padding: 14px; } .tile b { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; } .tile span { font-size: 13px; color: var(--muted); } .tile small { font-size: 12px; color: var(--muted); }
  .chart { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }
  .chart .ax { font: 800 10px Nunito, sans-serif; fill: var(--muted); } .chart .so { font-style: italic; }
  table.act tr.unseen td { color: var(--muted); font-style: italic; }
  .chip.pick.on { background: var(--grape-lip); color: #fff; }
  .upthumb { width: 72px; height: 72px; flex: none; border-radius: 14px; overflow: hidden; background: var(--line); }
  .upthumb img { width: 100%; height: 100%; object-fit: cover; }
  #logForm .pick.on { background: var(--grape-lip); color: #fff; border-color: var(--grape-lip); } .chart .lab { font: 900 12px Nunito, sans-serif; fill: var(--ink); }
  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: #fff; font: 800 13px Nunito, sans-serif; padding: 6px 10px; border-radius: 10px; opacity: 0; transition: opacity .12s; max-width: 260px; }
  .tstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tstats b { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; } .tstats span { font-size: 12px; color: var(--muted); line-height: 1.2; display: block; }
  .pill { border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 900; white-space: nowrap; flex: none !important; }
  .s-normal { background: #E3F6EA; color: var(--fern-lip); } .s-watch { background: #FFF2D6; color: #B87700; } .s-vet { background: #FFE6E8; color: var(--coral-lip); }
  .month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; text-align: center; }
  .month b { font-size: 12px; color: var(--muted); padding: 4px 0; }
  .month .day { aspect-ratio: 1; border: 0; border-radius: 12px; background: var(--bg); font: 800 15px Nunito, sans-serif; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; min-width: 0; }
  .month .day span { display: flex; gap: 2px; height: 6px; }
  .month .day i, .legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .month .day.today { box-shadow: inset 0 0 0 2px var(--sky); }
  .month .day.sel { background: var(--sky); color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 800; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .btn.monthnav { width: 44px; flex: none; padding-left: 0; padding-right: 0; }
  .chip.pick { cursor: pointer; border: 0; font: inherit; }
  select { font: 800 16px Nunito, sans-serif; padding: 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
  .birthday { background: linear-gradient(180deg, #F3EDFF, var(--card)); border-color: #D9C8FF; }
  .camgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .camgrid .cam img, .camgrid .cam video { cursor: zoom-in; }
  .how { margin-top: 8px; }
  .how summary { cursor: pointer; font-weight: 900; font-size: 13px; color: var(--grape-lip); list-style: none; }
  .how summary::-webkit-details-marker { display: none; }
  .how summary::after { content: " ›"; }
  .how[open] summary::after { content: " ⌄"; }
  .how ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .how li { display: flex; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .how li i { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--line); color: var(--muted); font-style: normal; font-weight: 900; font-size: 11px; display: grid; place-items: center; }
  .how li.check i { background: var(--coral); color: var(--ink); } .how li.ok i, .how li:last-child:not(.check) i { background: var(--fern); color: var(--ink); }
  .how li.ask i { background: var(--grape-lip); color: #fff; } .how li.warn i { background: var(--sun); color: var(--ink); }
  .how small { color: var(--muted); font-size: 12px; }
  .recap img { width: 100%; border-radius: 16px; display: block; margin-bottom: 12px; }
  .center { text-align: center; }
  .hero { padding: 34px 4px 10px; }
  .beanbox { display: grid; place-items: center; margin: 0 auto 10px; }
  .hero .big { width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 28px; background: var(--fern); box-shadow: 0 7px 0 var(--fern-lip); display: grid; place-items: center; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--sky); animation: spin .8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pop { animation: pop .32s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 900; z-index: 9; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs" class="hidden"><div class="in">
  <button data-tab="today"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Diary</button>
  <button data-tab="care"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>Care</button>
  <button data-tab="calendar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>Calendar</button>
  <button data-tab="stats"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-tab="cam"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="3"/><path d="M8 21h8"/><circle cx="16.5" cy="9" r="1.2" fill="currentColor"/></svg>Pet cam</button>
  <button data-tab="devices"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>Devices</button>
</div></nav>

<script src="/bean.js"></script>
<script src="/calendar.js"></script>
<script src="/tray.js"></script>
<script src="/routines.js"></script>
<script src="/activity.js"></script>
<script src="/sticker.js"></script>
<script src="/climate.js"></script>
<script src="/rtc.js"></script>
<script src="/factcard.js"></script>
<script src="/live.js"></script>
<script src="/levels.js"></script>
<script>
// FurSight web app: the household's home. Add a pet (a photo, then Muse Spark writes the profile and care plan),
// read the diary every device writes to, link devices with a code, and run or watch the pet cam.
// Talks to the hub (households, diary, codes: Cloudflare) and to this server's /api (Meta models).
const HUB = "https://fursight-cam.wibble-crossplay.workers.dev";
const RELAY = HUB;
const $app = document.getElementById("app"), $tabs = document.getElementById("tabs");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};
// a link with #t=<token> signs this browser in (the demo household from scripts/demo.js); the fragment never reaches a server
const hashT = /^#t=(fs1\.[\w.-]+)$/.exec(location.hash);
if (hashT) { store.set("fs.token", hashT[1]); history.replaceState(null, "", location.pathname + location.search); }
let token = store.get("fs.token"), me = null, tab = store.get("fs.tab") || "today";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const p0name = () => (me && me.pets && me.pets[0] ? me.pets[0].name : "His");
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : "");

async function hub(path, opt = {}) {
  const r = await fetch(HUB + "/hub" + path, { ...opt, headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { token = null; store.set("fs.token", null); render(); throw new Error("This phone was unlinked."); }
  if (!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + token }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "The model didn't answer, try again");
  return j;
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast pop"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const img = (path) => HUB + "/hub" + path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token);

// a photo from the phone, shrunk to a JPEG data URL (long side `max`)
function shrink(file, max = 768) {
  return new Promise((ok, no) => {
    const i = new Image();
    i.onload = () => {
      const k = Math.min(1, max / Math.max(i.width, i.height));
      const c = document.createElement("canvas"); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
      c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", 0.82)); URL.revokeObjectURL(i.src);
    };

// link a simulated device to this household without typing a code; returns its device key
async function linkSimulated(kind, name) {
  const s = await hub("/link/start", { method: "POST", body: JSON.stringify({ kind, name }) });
  await hub("/link/claim", { method: "POST", body: JSON.stringify({ code: s.code }) });
  for (let i = 0; i < 12; i++) {
    const p = await hub(`/link/poll?code=${s.code}&nonce=${s.nonce}`);
    if (p.status === "linked") return p.token;
    await new Promise((ok) => setTimeout(ok, 700));
  }
  throw new Error("Couldn't link it, try again");
}

// this browser joins a household: show a code, wait for another linked phone to enter it
async function linkThis(kind) {
  $app.innerHTML = `<div class="stack center pop" style="padding-top:30px"><h2>Link this ${kind === "camera" ? "camera" : "phone"}</h2>
    <p class="muted">On a phone that already has FurSight, open <b>Devices</b>, tap <b>Link a device</b> and enter:</p>
    <div class="card"><div class="code" id="code">····</div></div><div class="spinner"></div>
    <button class="btn ghost" id="back">Back</button></div>`;
  document.getElementById("back").onclick = () => { stopLink = true; render(); };
  let stopLink = false;
  const s = await hub("/link/start", { method: "POST", body: JSON.stringify({ kind, name: deviceName() }) });
  document.getElementById("code").textContent = s.code;
  while (!stopLink) {
    await new Promise((r) => setTimeout(r, 1800));
    const p = await hub(`/link/poll?code=${s.code}&nonce=${s.nonce}`);
    if (p.status === "linked") { token = p.token; store.set("fs.token", token); toast("Linked"); return render(); }

  }
}

      <div style="min-width:0"><h3>${esc(e.title || word)}</h3><div class="vword t-${v}">${esc(word)}</div>

      <div class="when">${e.extra && e.extra.uploaded ? `Uploaded${e.extra.pages ? ` · ${e.extra.pages} page${e.extra.pages === 1 ? "" : "s"}` : e.extra.secs ? ` · ${e.extra.secs} s video` : ""}` : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}${e.source ? " · from " + esc(e.source) : ""} · <button class="del" data-del="${e.id}">Remove</button></div></div></div>`;
  }).join("");
  remindButtons($l);

  for (const im of $l.querySelectorAll(".entry img, .recap > img")) im.onclick = () => enlarge(im.src, im.classList.contains("sticker"));
  for (const b of $l.querySelectorAll(".livecardbox")) b.onclick = () => enlarge(b.dataset.png);
  // remove an entry: asks first, then it's gone from every device
  for (const b of $l.querySelectorAll("[data-del]")) b.onclick = async () => {
    if (!confirm("Remove this from the diary? It's removed on every device and can't be undone.")) return;
    b.disabled = true;
    try {
      await hub("/diary/" + b.dataset.del, { method: "DELETE" });
      const card = $l.querySelector(`[data-entry="${b.dataset.del}"]`);
      if (card) { card.style.transition = "opacity .2s, transform .2s"; card.style.opacity = "0"; card.style.transform = "scale(.96)"; setTimeout(() => card.remove(), 200); }
      toast("Removed");
    } catch (err) { b.disabled = false; toast(err.message); }
  };
}

// ---------------------------------------------------------------- uploads: old photos, videos and vet records
// Everything is read in the browser first: a photo is shrunk, a video gives four frames (kept as one 2 by 2 sheet:
// the video itself isn't stored), a PDF gives its first pages as pictures (page 1 is kept). With "Understand it",
// Muse Spark reads them (/api/understand) and fills in the title, the summary and, for a vet record, the details.

const UPKIND = { record: "Vet record", photo: "Photo", video: "Video" };
const ymd = (t) => FSCal.key(new Date(t));
const loadScript = (src) => new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("couldn't load the PDF reader")); document.head.appendChild(s); });
const canvasJpeg = (c, q = 0.82) => c.toDataURL("image/jpeg", q);

async function pdfPages(file, n = 4) {
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise, out = [];
  for (let i = 1; i <= Math.min(n, doc.numPages); i++) {
    const page = await doc.getPage(i), v1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: Math.min(2, 1200 / v1.width) });
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: g, viewport: vp }).promise;
    out.push(canvasJpeg(c, 0.8));
  }
  return { pages: out, total: doc.numPages };
}

function videoFrames(file, n = 4) {
  return new Promise((ok, no) => {
    const v = document.createElement("video"), url = URL.createObjectURL(file), frames = [];
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    v.onerror = () => { URL.revokeObjectURL(url); no(new Error("This browser can't read that video")); };
    v.onloadedmetadata = async () => {
      const k = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight)), w = Math.round(v.videoWidth * k), h = Math.round(v.videoHeight * k);
      for (let i = 0; i < n; i++) {
        await new Promise((r) => { v.onseeked = r; v.currentTime = Math.min(v.duration - 0.05, v.duration * (0.1 + (0.8 * i) / Math.max(1, n - 1))); });
        const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(v, 0, 0, w, h); frames.push(c);
      }
      // the four frames as one 2 by 2 sheet for the diary
      const s = document.createElement("canvas"); s.width = w * 2 + 6; s.height = h * 2 + 6;
      const g = s.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, s.width, s.height);
      frames.forEach((f, i) => g.drawImage(f, (i % 2) * (w + 6), Math.floor(i / 2) * (h + 6)));
      URL.revokeObjectURL(url);
      ok({ frames: frames.map((f) => canvasJpeg(f, 0.8)), sheet: canvasJpeg(s, 0.8), secs: Math.round(v.duration) });
    };
  });
}

// the diary entry: extra is capped at 4000 characters, so long lists are trimmed
function trimRecord(r) {
  if (!r) return undefined;
  const s = (x, n = 160) => String(x || "").slice(0, n), l = (a, n = 8) => (Array.isArray(a) ? a : []).slice(0, n);
  return { clinic: s(r.clinic, 80), reason: s(r.reason), weight_g: Number(r.weight_g) || 0, findings: l(r.findings).map((x) => s(x)), medications: l(r.medications, 6).map((m) => ({ name: s(m.name, 60), dose: s(m.dose, 100), until: s(m.until, 10) })),
    vaccinations: l(r.vaccinations, 6).map((v) => ({ name: s(v.name, 60), given: s(v.given, 10), next_due: s(v.next_due, 10) })), follow_up: r.follow_up && r.follow_up.date ? { date: s(r.follow_up.date, 10), what: s(r.follow_up.what, 100) } : null };
}

// dates in a record worth a reminder: the follow-up and jabs coming due
function recordDates(rec) {
  if (!rec) return [];
  const today = ymd(Date.now()), out = [];
  if (rec.follow_up && rec.follow_up.date >= today) out.push({ date: rec.follow_up.date, title: rec.follow_up.what || "Vet follow-up", repeat: "none" });
  for (const v of rec.vaccinations || []) if (v.next_due && v.next_due >= today) out.push({ date: v.next_due, title: `${v.name} vaccination due`, repeat: "yearly" });
  return out.filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d.date));
}

function recordDetails(e) {
  const r = e.extra && e.extra.record, sn = e.extra && e.extra.seen;
  if (!r && !(sn && sn.health_notes && sn.health_notes.length)) return "";
  const li = (a) => a.map((x) => `<li><span>${esc(x)}</span></li>`).join("");
  const rows = r ? [
    r.clinic && `Clinic: ${r.clinic}`, r.reason && `Why: ${r.reason}`, r.weight_g && `Weight: ${(r.weight_g / 1000).toFixed(2)} kg`,
    ...r.findings.map((f) => `Found: ${f}`), ...r.medications.map((m) => `Medicine: ${m.name}, ${m.dose}${m.until ? ` until ${m.until}` : ""}`),
    ...r.vaccinations.map((v) => `Vaccination: ${v.name}${v.given ? `, given ${v.given}` : ""}${v.next_due ? `, next due ${v.next_due}` : ""}`),
    r.follow_up && `Follow-up: ${r.follow_up.what} on ${r.follow_up.date}`].filter(Boolean) : sn.health_notes;
  const dates = recordDates(r);
  return `<details class="how"><summary>${r ? "What it says" : "What FurSight noticed"}</summary><ol>${li(rows)}</ol>
    ${dates.map((d) => `<button class="btn ghost small" data-remind='${esc(JSON.stringify(d))}' style="margin-top:6px">Remind me: ${esc(d.title)}, ${esc(FSCal.day(d.date).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }))}</button>`).join("")}</details>`;
}
function remindButtons(root) {
  for (const b of root.querySelectorAll("[data-remind]")) b.onclick = async () => {
    const d = JSON.parse(b.dataset.remind);
    b.disabled = true;
    try { await hub("/diary", { method: "POST", body: JSON.stringify({ kind: "event", title: d.title, pet: me.pets[0].name, extra: { date: d.date, repeat: d.repeat } }) }); b.textContent = "On the calendar"; }
    catch (err) { b.disabled = false; toast(err.message); }
  };
}

function uploadPage() {
  stopCam();
  const p = me.pets[0], items = [];
  $app.innerHTML = `<div class="stack pop">
    <div class="row" style="justify-content:space-between"><h1>Add to ${esc(p.name)}'s record</h1><button class="btn ghost small" id="upBack" style="flex:none;width:auto">Done</button></div>
    <p class="muted">Old photos and videos, vet letters, invoices, vaccination cards, lab results. Photos of paper work too.</p>
    <label class="btn sky" for="upFiles">Choose photos, videos or PDFs</label>
    <input id="upFiles" type="file" multiple accept="image/*,video/*,application/pdf,.pdf" class="hidden">
    <div id="upList" class="stack"></div>
    <button class="btn" id="upSave" disabled>Save to the diary</button>
    <p class="when">Videos keep four still frames, not the video. PDFs keep their first page as a picture; FurSight reads up to four.</p></div>`;
  const $list = document.getElementById("upList"), $save = document.getElementById("upSave");
  document.getElementById("upBack").onclick = () => { history.replaceState(null, "", location.pathname); tab = "today"; render(); };
  document.getElementById("upFiles").onchange = async (ev) => {
    for (const f of [...ev.target.files].slice(0, 12)) {

      const it = { f, kind, id: "u" + items.length, understand: true, status: "Reading…" };
      items.push(it);
      $list.insertAdjacentHTML("beforeend", `<div class="card stack" id="${it.id}"><div class="row" style="align-items:flex-start">
        <div class="upthumb"></div><div style="flex:1;min-width:0"><h3 style="overflow-wrap:anywhere">${esc(f.name)}</h3>
        <select data-k="kind">${Object.entries(UPKIND).map(([k, w]) => `<option value="${k}" ${k === kind ? "selected" : ""}>${w}</option>`).join("")}</select></div></div>
        <div class="row"><div><label>Date</label><input type="date" data-k="date" value="${ymd(f.lastModified || Date.now())}" max="${ymd(Date.now())}"></div></div>
        <label style="display:flex;align-items:center;gap:10px;font-weight:800;cursor:pointer"><input type="checkbox" data-k="understand" checked style="width:22px;height:22px;flex:none;margin:0">Understand it with Muse Spark</label>
        <input data-k="note" placeholder="Anything to add? (optional)" maxlength="200">
        <div class="when" data-k="status">Reading…</div><div data-k="result"></div></div>`);
      const $c = document.getElementById(it.id), q = (k) => $c.querySelector(`[data-k="${k}"]`);
      q("kind").onchange = () => (it.kind = q("kind").value);
      q("date").onchange = () => (it.dateTouched = true);
      try {
        if (kind === "record" && /pdf/.test(f.type + f.name)) { const r = await pdfPages(f); it.images = r.pages; it.keep = r.pages[0]; it.pages = r.total; }
        else if (kind === "video") { const r = await videoFrames(f); it.images = r.frames; it.keep = r.sheet; it.secs = r.secs; }
        else { it.keep = await shrink(f, 1400); it.images = [it.keep]; }
        $c.querySelector(".upthumb").innerHTML = `<img src="${it.keep}" alt="">`;
        q("status").textContent = kind === "video" ? `${it.secs} s video, 4 frames` : it.pages ? `${it.pages} page${it.pages === 1 ? "" : "s"}` : "Ready";
        it.ready = true;
      } catch (err) { it.failed = true; q("status").textContent = err.message || "Couldn't read this file"; }
      $save.disabled = !items.some((x) => x.ready && !x.saved);
    }
    ev.target.value = "";
  };
  $save.onclick = async () => {
    $save.disabled = true;
    for (const it of items.filter((x) => x.ready && !x.saved)) {
      const $c = document.getElementById(it.id), q = (k) => $c.querySelector(`[data-k="${k}"]`);
      const note = q("note").value.trim();
      let u = null;
      if (q("understand").checked) {
        q("status").textContent = "Muse Spark is reading it…";
        try { u = await api("/api/understand", { kind: it.kind, images: it.images, note, pet: { name: p.name, species: p.species, breed: p.breed, notes: p.notes } }); }
        catch (err) { q("status").textContent = "Couldn't read it (" + err.message + "), saving it as it is"; }
      }
      // the date it says beats the file's date, unless you picked one
      const date = !it.dateTouched && u && /^\d{4}-\d{2}-\d{2}$/.test(u.date) && u.date <= ymd(Date.now()) ? u.date : q("date").value;
      q("date").value = date;
      const record = it.kind === "record" && u ? trimRecord(u.record) : undefined;
      const entry = { kind: it.kind, pet: p.name, image: it.keep, at: FSCal.day(date).getTime(),
        title: (u && u.title) || `${UPKIND[it.kind]}: ${it.f.name.replace(/\.[^.]+$/, "")}`.slice(0, 120),
        note: [u && u.summary, note && `You said: ${note}`].filter(Boolean).join(" ").slice(0, 1200),
        ...(u && u.verdict === "vet" ? { verdict: "vet" } : u && u.verdict === "watch" ? { verdict: "caution" } : {}),
        extra: { uploaded: true, understood: !!u, file: it.f.name.slice(0, 60), ...(it.pages ? { pages: it.pages } : {}), ...(it.secs ? { secs: it.secs } : {}), ...(record ? { record } : {}), ...(u && it.kind !== "record" ? { seen: { doing: String(u.seen.doing || "").slice(0, 160), pose: u.seen.pose, health_notes: (u.seen.health_notes || []).slice(0, 5).map((x) => String(x).slice(0, 160)) } } : {}) } };
      q("status").textContent = "Saving…";
      try { const saved = await hub("/diary", { method: "POST", body: JSON.stringify(entry) }); it.saved = true;
        q("status").textContent = `Saved to ${new Date(entry.at).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}`;
        q("result").innerHTML = `<h3>${esc(entry.title)}</h3>${entry.note ? `<p class="muted">${esc(entry.note)}</p>` : ""}${recordDetails({ ...saved, extra: entry.extra })}`;
        const det = q("result").querySelector("details"); if (det) det.open = true;
        remindButtons(q("result"));
      } catch (err) { q("status").textContent = err.message; }
    }
    $save.disabled = !items.some((x) => x.ready && !x.saved);
  };
}

// What the Ask agent did before it answered: each look, each check that stopped an answer, and any question it
// asked back. Shown folded under the answer.
function howDecided(e) {
  const steps = e.extra && Array.isArray(e.extra.steps) ? e.extra.steps : [];
  if (!steps.length) return "";
  const icon = (s) => s.kind === "check" ? "✕" : s.kind === "warn" ? "!" : s.tool === "answer" ? "✓" : s.tool === "ask" ? "?" : "•";
  return `<details class="how"><summary>How it decided</summary><ol>
    ${e.extra.asked ? `<li class="ask"><i>?</i><span>It asked: ${esc(e.extra.asked)}<br><b>You said:</b> ${esc(e.extra.reply || "")}</span></li>` : ""}
    ${steps.map((s) => `<li class="${s.kind || ""}"><i>${icon(s)}</i><span>${esc(s.label)}${s.detail ? `<br><small>${esc(s.detail)}</small>` : ""}</span></li>`).join("")}</ol></details>`;
}

// ---------------------------------------------------------------- daily care: tick the care plan's daily list

const dayKey = (t) => new Date(t).toDateString();
function careState(entries, items) {
  const byDay = new Map();
  for (const e of entries) if (e.kind === "care") { const d = dayKey(e.at); if (!byDay.has(d)) byDay.set(d, new Set()); byDay.get(d).add(e.title); }
  const done = (d) => items.length && items.every((i) => byDay.get(d.toDateString())?.has(i));
  const day = new Date(); if (!done(day)) day.setDate(day.getDate() - 1);
  let streak = 0; while (done(day)) { streak++; day.setDate(day.getDate() - 1); }
  return { today: byDay.get(new Date().toDateString()) || new Set(), streak };
}
const careItems = (p) => ((p.care && p.care.daily) || []).slice(0, 8);

async function care() {
  const p = me.pets[0], items = careItems(p);
  $app.innerHTML = `<div class="stack">${header()}<div id="tray"></div><div id="activity"></div><div id="checklist"></div><div id="routines"></div><div id="ideas"></div>
    <div class="card stack"><div class="row" style="justify-content:space-between"><h3>Nicknames</h3><button class="btn ghost small" id="nickEdit" style="flex:none;width:auto">Edit</button></div>
      <div id="nickView">${nicknames(p).length ? `<div class="chips">${nicknames(p).map((n) => `<span class="chip">${esc(n)}</span>`).join("")}</div>` : `<p class="muted">Add a few and FurSight will use them sometimes.</p>`}</div>
      <div id="nickForm" class="hidden"><input id="nickIn" value="${esc(p.nicknames || "")}" placeholder="e.g. Si Si, Little Loaf" maxlength="120"><button class="btn" id="nickSave" style="margin-top:8px">Save nicknames</button></div></div>
    ${p.notes ? `<div class="card"><h3>Notes</h3><p class="muted">${esc(p.notes)}</p></div>` : ""}${carePlan(p.care || {})}</div>`;
  document.getElementById("nickEdit").onclick = () => { document.getElementById("nickForm").classList.toggle("hidden"); document.getElementById("nickIn").focus(); };
  document.getElementById("nickSave").onclick = async () => {
    const r = await hub("/pets/" + p.id, { method: "PUT", body: JSON.stringify({ nicknames: document.getElementById("nickIn").value.trim() }) });
    if (r.nicknames === undefined) toast("Saved here; it sticks once the hub is updated"); else toast("Nicknames saved");
    me = await hub("/me"); care();
  };
  if (!items.length) return;
  const { entries } = await hub("/diary?limit=200");
  document.getElementById("tray").innerHTML = trayCard(FSTray.summary(entries), p, FSClimate.summary(entries));
  routinesCard(entries, p);
  ideasCard(entries, p);
  document.getElementById("activity").innerHTML = activityCard(FSActivity.summary(entries), p);
  logForm(p);
  const st = careState(entries, items);
  const left = items.filter((i) => !st.today.has(i)).length;
  document.getElementById("checklist").innerHTML = `<div class="card pop">
    <div class="row" style="justify-content:space-between"><div class="row" style="gap:6px;flex:1">${bean(left ? "idle" : "safe", 40)}<h2>Today's care</h2></div>
      <div class="streak" style="flex:none"><span class="flame">${st.streak}</span><span class="muted" style="line-height:1.1">day<br>streak</span></div></div>
    <div class="bar"><i style="width:${Math.round(((items.length - left) / items.length) * 100)}%"></i></div>
    <p class="muted" style="margin:8px 0 4px">${left ? `${left} to go` : `All done for today. Lovely.`}</p>
    ${items.map((i) => `<div class="check ${st.today.has(i) ? "done" : ""}" data-item="${esc(i)}"><div class="box"></div><span>${esc(i)}</span></div>`).join("")}</div>`;
  for (const el of document.querySelectorAll(".check:not(.done)")) el.onclick = async () => {
    el.classList.add("done");
    try { await hub("/diary", { method: "POST", body: JSON.stringify({ kind: "care", title: el.dataset.item, pet: p.name }) }); } catch (e) { el.classList.remove("done"); return toast(e.message); }
    care();
  };
}

// ---------------------------------------------------------------- his day from the pet cam: resting, flops, on the move

function activityCard(a, p) {
  if (!a.has && !a.moment) return "";
  const rows = [["loaf", "Loafing"], ["stretched", "Stretched out"], ["flop", "Flopped"], ["active", "On the move"], ["eating", "Eating"], ["grooming", "Grooming"]]
    .filter(([k]) => a.week[k] > 0);
  return `<div class="card stack pop"><div class="row" style="justify-content:space-between"><h2>${esc(p.name)}'s day</h2><span class="chip" style="flex:none">${a.today.flops} flop${a.today.flops === 1 ? "" : "s"} today</span></div>
    ${a.moment ? `<div class="moment${a.moment.has_image ? "" : " noimg"}${a.moment.extra && a.moment.extra.sticker ? " sticker" : ""}">${a.moment.has_image ? `<img src="${img(`/diary/${a.moment.id}/image`)}" alt="">` : ""}<p><b>${esc(a.moment.title)}</b><br><span class="when">${new Date(a.moment.at).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })}</span></p></div>` : ""}
    <table class="act"><tr><th></th><th>Today</th><th>This week</th></tr>
      ${rows.map(([k, w]) => `<tr><td>${w}</td><td>${FSActivity.time(a.today[k])}</td><td>${FSActivity.time(a.week[k])}</td></tr>`).join("")}
      ${a.today.camOn !== undefined ? `<tr class="unseen"><td>Out of view</td><td>${FSActivity.time(a.today.outOfView)}</td><td>${FSActivity.time(a.week.outOfView)}</td></tr>
      <tr class="unseen"><td>No cam on</td><td>${FSActivity.time(a.today.noCam)}</td><td>${FSActivity.time(a.week.noCam)}</td></tr>`
      : `<tr class="unseen"><td>Not seen</td><td>${FSActivity.time(a.today.unseen)}</td><td>${FSActivity.time(a.week.unseen)}</td></tr>`}</table>
    <p class="when">Only what the cams saw is counted. Not seen means out of view, another room, the cam off or the night: FurSight doesn't guess.${a.week.flopsYou ? ` ${a.week.flopsYou} flop${a.week.flopsYou === 1 ? "" : "s"} this week ${a.week.flopsYou === 1 ? "was" : "were"} added by you.` : ""}</p>

// the owner adds what the cams didn't see (through /api/log, which checks a treat against his never list)
function logForm(p) {
  const open = document.getElementById("logOpen");
  if (!open) return;
  const $f = document.getElementById("logForm"), $item = document.getElementById("logItem"), $amt = document.getElementById("logAmount"), $save = document.getElementById("logSave");
  let what = null;
  open.onclick = () => { $f.classList.toggle("hidden"); open.classList.add("hidden"); document.getElementById("noteText").focus(); };
  // your own words: /api/note checks a food and puts the day it's OK again on the calendar, ticks care, marks grooming
  const $note = document.getElementById("noteText"), $nb = document.getElementById("noteSave"), $out = document.getElementById("noteOut");
  $nb.onclick = async () => {
    if (!$note.value.trim()) return $note.focus();
    $nb.disabled = true; $nb.textContent = "Reading it…";
    try {
      const r = await api("/api/note", { text: $note.value.trim(), tz: -new Date().getTimezoneOffset() });
      $note.value = "";
      $out.innerHTML = r.done.map((d) => `<p style="margin:0${d.verdict === "toxic" ? ";color:var(--coral)" : ""}">${d.verdict === "toxic" ? "⚠️ " : "✓ "}${esc(d.said)}</p>`).join("");
    } catch (e) { toast(e.message); }
    $nb.disabled = false; $nb.textContent = "Add note";
  };
  for (const b of $f.querySelectorAll("[data-log]")) b.onclick = () => {
    what = b.dataset.log;
    for (const o of $f.querySelectorAll("[data-log]")) o.classList.toggle("on", o === b);
    $item.classList.toggle("hidden", !["treat", "greens", "note"].includes(what));
    $amt.classList.toggle("hidden", !["treat", "greens"].includes(what));
    $item.placeholder = what === "note" ? "What happened?" : what === "greens" ? "Which? e.g. coriander" : "What? e.g. a slice of apple";
    $save.disabled = false;
  };
  $save.onclick = async () => {
    if (["treat", "greens", "note"].includes(what) && !$item.value.trim()) return $item.focus();
    $save.disabled = true;
    let r;
    try { r = await api("/api/log", { what, item: $item.value.trim(), amount: $amt.value, tz: -new Date().getTimezoneOffset() }); } catch (e) { $save.disabled = false; return toast(e.message); }
    toast(r.never ? "Careful: that's on his never list" : r.said || "Added. Thanks for filling the gap");
    care();
  };
}

// charts: one y-axis each, thin marks, a recessive grid, a hover/tap tooltip from data-tip
const CW = 320, CH = 150, PL = 40, PB = 22, PT = 14;
// a round step (1, 2, 2.5, 5 x 10^n) so three steps cover the span
const niceStep = (span) => { const e = Math.pow(10, Math.floor(Math.log10(span / 3 || 1))); return [1, 2, 2.5, 5, 10].map((m) => m * e).find((st) => st * 3 >= span) || 10 * e; };
function axis(max, min = 0, unit = "") {
  const steps = 3, lines = [];
  for (let i = 0; i <= steps; i++) {
    const v = min + ((max - min) * i) / steps, y = CH - PB - ((CH - PB - PT) * i) / steps;
    lines.push(`<line x1="${PL}" x2="${CW}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${PL - 6}" y="${y + 4}" text-anchor="end" class="ax">${Math.round(v)}${i === steps && unit ? " " + unit : ""}</text>`);
  }
  return lines.join("");
}
function lineChart(pts, { unit = "", colour = "var(--sky)" } = {}) {
  const ys = pts.map((p) => p.y), st = niceStep(Math.max(...ys) - Math.min(...ys) + 10);
  let lo = Math.floor((Math.min(...ys) - 5) / st) * st, hi = lo + 3 * st;
  if (hi < Math.max(...ys) + 5) { lo += st; hi += st; }
  const X = (i) => PL + 12 + (i * (CW - PL - 24)) / Math.max(1, pts.length - 1), Y = (v) => CH - PB - ((v - lo) / (hi - lo)) * (CH - PB - PT);
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${CW} ${CH}" class="chart" role="img" aria-label="Weight over ${pts.length} days">${axis(hi, lo, unit)}
    <polyline points="${pts.map((p, i) => `${X(i)},${Y(p.y)}`).join(" ")}" fill="none" stroke="${colour}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i === pts.length - 1 ? 5 : 4}" fill="${i === pts.length - 1 ? colour : "var(--card)"}" stroke="${colour}" stroke-width="2"/><rect x="${X(i) - 18}" y="${PT}" width="36" height="${CH - PT - PB}" fill="transparent" data-tip="${esc(p.tip)}"/>`).join("")}
    <text x="${X(pts.length - 1)}" y="${Y(last.y) + (Y(last.y) > CH - PB - 24 ? -12 : 22)}" text-anchor="end" class="lab">${last.y} g</text>
    ${pts.map((p, i) => `<text x="${X(i)}" y="${CH - 6}" text-anchor="middle" class="ax">${p.x}</text>`).join("")}</svg>`;
}
function bars(items, max, draw) {
  const bw = (CW - PL - 8) / items.length, H = (v) => ((CH - PB - PT) * v) / max;
  return items.map((it, i) => {
    const x = PL + 4 + i * bw + 3, w = bw - 6, cx = PL + 4 + i * bw + bw / 2;
    const label = `<text x="${cx}" y="${CH - 6}" text-anchor="middle" class="ax">${it.x}</text>`;
    if (!it.partial) return draw(it, x, w, H) + label;
    // a day still going: faded, a dashed outline of a usual day behind it, and "so far" on top
    const val = it.parts ? it.parts.reduce((t, p) => t + p.v, 0) : it.y || 0, top = it.lo != null ? null : CH - PB - H(Math.max(val, it.ghost || 0));
    const ghost = it.ghost > 0 ? `<rect x="${x + 0.75}" y="${CH - PB - H(it.ghost)}" width="${w - 1.5}" height="${H(it.ghost)}" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>` : "";
    return ghost + `<g opacity=".45">${draw(it, x, w, H)}</g>` + (top !== null ? `<text x="${cx}" y="${Math.max(PT - 2, top - 5)}" text-anchor="middle" class="ax so">so far</text>` : "") + label;
  }).join("");
}
// a bar with its data end rounded (4px) and its base square on the axis
const bar = (x, y, w, h, fill, round) => h <= 0 ? "" : round ? `<path d="M${x},${y + h}V${y + Math.min(4, h)}Q${x},${y} ${x + Math.min(4, w / 2)},${y}H${x + w - Math.min(4, w / 2)}Q${x + w},${y} ${x + w},${y + Math.min(4, h)}V${y + h}Z" fill="${fill}"/>` : `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
function barChart(items, colour, unit = "") {
  const max = niceStep(Math.max(1, ...items.map((i) => i.y)) * 1.05) * 3;
  return `<svg viewBox="0 0 ${CW} ${CH}" class="chart" role="img">${axis(max, 0, unit)}${bars(items, max, (it, x, w, h) => { const hh = h(it.y), y = CH - PB - hh; return bar(x, y, w, hh, colour, true) + `<rect x="${x}" y="${PT}" width="${w}" height="${CH - PT - PB}" fill="transparent" data-tip="${esc(it.tip)}"/>`; })}</svg>`;
}
function stackChart(items) {
  const max = niceStep(Math.max(30, ...items.map((i) => i.parts.reduce((a, p) => a + p.v, 0))) * 1.05) * 3;
  return `<svg viewBox="0 0 ${CW} ${CH}" class="chart" role="img" aria-label="Minutes resting each day">${axis(max, 0, "min")}${bars(items, max, (it, x, w, h) => {
    let y = CH - PB, out = "";
    const live = it.parts.filter((p) => p.v > 0);
    live.forEach((p, j) => { const hh = h(p.v); y -= hh; out += bar(x, y + (j ? 1 : 0), w, hh - (j ? 2 : 0), STAT_COL[p.k], j === live.length - 1); });
    return out + `<rect x="${x}" y="${PT}" width="${w}" height="${CH - PT - PB}" fill="transparent" data-tip="${esc(it.tip)}"/>`;
  })}</svg>`;
}
// a day's coolest to warmest, with the 25°C line where it gets too warm for a rabbit
function rangeChart(items) {
  if (!items.length) return "";
  const lo = Math.min(10, ...items.map((i) => i.lo)) , hi = Math.max(30, ...items.map((i) => i.hi));
  const st = niceStep(hi - lo), min = Math.floor(lo / st) * st, max = min + 3 * st >= hi ? min + 3 * st : min + 4 * st;
  const Y = (v) => CH - PB - ((v - min) / (max - min)) * (CH - PB - PT);
  return `<svg viewBox="0 0 ${CW} ${CH}" class="chart" role="img" aria-label="Room temperature each day">${axis(max, min, "°C")}
    <line x1="${PL}" x2="${CW}" y1="${Y(25)}" y2="${Y(25)}" stroke="var(--coral)" stroke-width="1.5" stroke-dasharray="4 4"/>
    ${bars(items, 1, (it, x, w) => { const y1 = Y(it.hi), y2 = Y(it.lo), hot = it.hi >= 25;
      return (it.partial ? `<text x="${x + w / 2}" y="${y1 - 5}" text-anchor="middle" class="ax so">so far</text>` : "") + `<rect x="${x + w * 0.2}" y="${y1}" width="${w * 0.6}" height="${Math.max(4, y2 - y1)}" rx="4" fill="${hot ? "var(--coral)" : "var(--sky)"}"/><rect x="${x}" y="${PT}" width="${w}" height="${CH - PT - PB}" fill="transparent" data-tip="${esc(it.tip)}"/>`; })}</svg>`;
}
function tips(root) {
  let t = document.getElementById("tip");
  if (!t) { t = document.createElement("div"); t.id = "tip"; document.body.appendChild(t); }
  const show = (e) => { const el = e.target.closest("[data-tip]"); if (!el) return (t.style.opacity = 0); t.textContent = el.dataset.tip; t.style.opacity = 1; t.style.left = Math.min(innerWidth - t.offsetWidth - 8, Math.max(8, e.clientX - t.offsetWidth / 2)) + "px"; t.style.top = e.clientY - t.offsetHeight - 14 + "px"; };
  root.addEventListener("pointermove", show); root.addEventListener("pointerdown", show); root.addEventListener("pointerleave", () => (t.style.opacity = 0));
}

// ---------------------------------------------------------------- calendar: the month at a glance, plus reminders

let calMonth = null, calDay = null;

async function calendar() {
  const p = me.pets[0], items = careItems(p), today = FSCal.key(new Date());

  const evs = FSCal.events(entries), diary = entries.filter((e) => !/^(event|tray)|^routine(-cancel)?$|^(pose|active|climate|camtime|levels)/.test(e.kind));
  const byDay = new Map();
  for (const e of diary) { const k = FSCal.key(new Date(e.at)); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); }

  const isFed = (e) => e.kind === "log" && e.extra && (e.extra.what === "treat" || e.extra.what === "greens");
  // Monday-first month grid
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), first = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  let cells = "";

  for (let d = 1; d <= n; d++) {

    const dots = [careDone(k) ? "fern" : "", list.some((e) => e.verdict === "toxic" || e.verdict === "vet") ? "coral" : list.some((e) => e.verdict === "caution") ? "sun" : list.length ? "sky" : "", evs.some((ev) => FSCal.on(ev, k)) ? "grape" : "", dueOn(k).length ? "sun" : "", list.some(isFed) ? "grape" : ""].filter(Boolean);
    cells += `<button class="day ${k === today ? "today" : ""} ${k === calDay ? "sel" : ""}" data-day="${k}">${d}<span>${dots.map((c) => `<i style="background:var(--${c})"></i>`).join("")}</span></button>`;
  }
  const sel = FSCal.day(calDay), dayEvs = evs.filter((ev) => FSCal.on(ev, calDay)), dayDiary = byDay.get(calDay) || [];
  const word = (e) => ({ safe: "Safe", caution: "Small treat only", toxic: "Don't", vet: "See a vet" }[e.verdict] || { care: "Care", ask: "Question", food: "Food check", photo: "Photo", recap: "Week card" }[e.kind] || cap(e.kind));

  document.getElementById("cal").innerHTML = `<div class="stack">

  // he ate something (today or a past day): saved with the day it's OK again, which goes on the calendar
  const $ate = document.getElementById("ateItem"), $ateAdd = document.getElementById("ateAdd");
  if ($ate) {

    $ate.onkeydown = (e) => e.key === "Enter" && !$ateAdd.disabled && $ateAdd.click();

      Object.assign($v, { src: c.clip, loop: true, muted: true, hidden: false }); $v.play().catch(() => {}); $i.hidden = true;
      $s.innerHTML = "<b></b>recording"; continue;
    }
    let last = 0, url = null, frames = 0;
    const show = (b) => { const u = URL.createObjectURL(b); $i.src = u; if (url) URL.revokeObjectURL(url); url = u; last = Date.now(); frames++; };
    // digital zoom, shared with everyone watching and with FurSight: tap zooms in 2× where you tapped
    let view = { z: 1, x: 0.5, y: 0.5 };
    const $z = document.querySelector(`[data-z="${c.channel}"]`);
    const showView = (v) => { view = v; $z.textContent = (Math.round(v.z * 10) / 10) + "×"; };
    const setView = (v) => { if (ws.readyState === 1) ws.send(JSON.stringify({ view: v })); else fetch(`${RELAY}/c/${c.channel}/view`, { method: "POST", body: JSON.stringify(v) }).then((r) => r.json()).then(showView).catch(() => {}); };
    const $v = document.querySelector(`[data-vid="${c.channel}"]`);
    $i.onclick = $v.onclick = (e) => {
      const r = e.currentTarget.getBoundingClientRect(), u = (e.clientX - r.left) / r.width, w = (e.clientY - r.top) / r.height;
      setView({ z: Math.min(4, view.z * 2), x: view.x + (u - 0.5) / view.z, y: view.y + (w - 0.5) / view.z });
    };
    document.querySelector(`[data-out="${c.channel}"]`).onclick = () => setView({ ...view, z: Math.max(1, view.z / 2) });
    document.querySelector(`[data-wide="${c.channel}"]`).onclick = () => setView({ z: 1, x: 0.5, y: 0.5 });
    const tick = setInterval(() => { if (!alive) return clearInterval(tick); $s.innerHTML = Date.now() - last < 3000 ? `<b></b>live${rtc && rtc.live ? " video" : ""} · ${frames} fps` : last ? "paused" : "waking the camera"; frames = 0; }, 1000);
    let opened = false;
    const ws = new WebSocket(RELAY.replace("https", "wss") + `/c/${c.channel}/watch`); socks.push(ws);
    ws.binaryType = "blob";
    const onFrame = () => { if (!alive || !rtc.live) return; last = Date.now(); frames++; $v.requestVideoFrameCallback(onFrame); };
    const rtc = FSRtc.watch({ ws, relay: RELAY, channel: c.channel, video: $v, onLive: (on) => {
      $v.hidden = !on; $i.hidden = on;
      if (on && $v.requestVideoFrameCallback) $v.requestVideoFrameCallback(onFrame);
    } });
    if (rtc) rtcs.push(rtc);
    // a heartbeat: on video the socket carries almost nothing, and an idle socket is closed after ~100 s
    const beat = setInterval(() => ws.readyState === 1 ? ws.send("ping") : ws.readyState > 1 && clearInterval(beat), 20e3);
    ws.onopen = () => (opened = true);
    ws.onmessage = (e) => {
      if (typeof e.data !== "string") return show(e.data);
      if (e.data === "pong") return;
      try { const m = JSON.parse(e.data); if (rtc && rtc.message(m)) return; if (m.view) showView(m.view); } catch (er) {}
    };
    ws.onclose = () => { clearInterval(beat); if (alive && !opened) poll(); else if (alive) setTimeout(() => { if (alive) { stopCam(); cam(); } }, 1500); };
    setTimeout(() => { if (!opened) ws.close(); }, 9000);
    async function poll() {
      const me_ = Math.random().toString(36).slice(2, 10);
      while (alive) {
        try {
          const r = await fetch(`${RELAY}/c/${c.channel}/frame.jpg?v=${me_}&t=${Date.now()}`, { cache: "no-store" });
          if (r.headers.get("x-view")) { try { showView(JSON.parse(r.headers.get("x-view"))); } catch (er) {} }
          if (r.status === 200 && Number(r.headers.get("x-frame-age")) < 3000) show(await r.blob()); else await new Promise((ok) => setTimeout(ok, 250));
        } catch (e) { await new Promise((ok) => setTimeout(ok, 500)); }
      }
    }
  }
}

// this browser becomes a pet cam: camera on, register with the household, send to the relay while watched

// place, the old one is replaced) or add a new one. A device that already is one of them just carries on.
function chooseCam() {

    ${me.cams.map((c) => `<button class="btn ghost" data-be="${c.channel}">${c.channel === mine ? `Carry on as ${esc(c.name)}` : `Be the ${esc(c.name)}${/\bcam(era)?$/i.test(c.name) ? "" : " cam"}`}</button>`).join("")}
    <button class="btn sky" id="beNew">A new camera</button>
