// a recording, as square frames in memory (12 a second, 360 px): played from here it can't be paused
const CLIP_FPS = 12, CLIP_SIDE = 360;
async function bakeClip(player) {
  if (!player.requestVideoFrameCallback || !window.createImageBitmap) return null;
  const out = [];
  let next = 0;
  player.loop = false; player.currentTime = 0; player.playbackRate = 2;
  await new Promise((done) => {
    const grab = async (_, meta) => {
      if (meta.mediaTime >= next) {
        const w = player.videoWidth, h = player.videoHeight, sq = Math.min(w, h);
        out.push(await createImageBitmap(player, (w - sq) / 2, (h - sq) / 2, sq, sq, { resizeWidth: CLIP_SIDE, resizeHeight: CLIP_SIDE }));
        next += 1 / CLIP_FPS;
      }
      if (player.ended || out.length >= 720) return done();
      player.requestVideoFrameCallback(grab);
    };
    player.onended = done;
    setTimeout(done, 20000);   // switched away mid-way (the video pauses): keep what's in hand
    player.requestVideoFrameCallback(grab);
    player.play();
  });
  player.onended = null; player.playbackRate = 1; player.loop = true; player.play();
  return out.length >= 12 ? out : null;   // under a second's worth: play the video itself instead
}

// clip: a video file to play instead of the camera (for recording a demo); it goes through everything the camera
// would, and the page says it's a recording.
async function beCam(resume = false, clip = null, fixedName = null, replaces = null, clipPath = null) {
  stopCam();
  const name = fixedName || (resume && store.get("fs.camName")) || prompt("Name this camera", store.get("fs.camName") || `${me.pets[0].name}'s pen`); if (!name) return render();
  if (!fixedName || !clip) store.set("fs.camName", name);   // the demo recording doesn't rename this device's cam
  if (!clip) store.set("fs.camOn", "1");   // a clip can't carry on after a reload
  let channel = store.get("fs.camChannel"), key = store.get("fs.camKey");
  const rnd = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789"[b % 56]).join("");
  if (!channel || !key) { channel = rnd(16); key = rnd(24); store.set("fs.camChannel", channel); store.set("fs.camKey", key); }
  await hub("/cams/" + channel, { method: "PUT", body: JSON.stringify({ name, ...(replaces ? { replaces } : {}), ...(clipPath ? { clip: clipPath } : {}) }) });
  $tabs.classList.add("hidden");
  $app.innerHTML = `<div class="stack pop"><h2>${esc(name)}</h2>${clip ? `<span class="chip" style="justify-self:start">Playing a recording: ${esc(clip.name)}</span>` : ""}<p class="muted">Leave this open near ${esc(me.pets[0].name)}, with his hay, food bowl and water in view. It only sends pictures while someone is watching, and checks the hay and bowls every couple of hours.</p>
    <div class="cam"><video id="v" playsinline muted autoplay></video><div class="live" id="st">starting</div></div>
    <p class="muted center" id="act" style="font-size:14px">Watching for ${esc(me.pets[0].name)}</p>
    ${clip ? "" : `<button class="btn ghost small" id="diaryToggle" style="justify-self:center"></button>`}
    <button class="btn ghost" id="stop">Stop being a pet cam</button></div>`;
  let clipFrames = null, clipT0 = 0;
  let ws, stream, timer, viewers = 0, jpeg = 0, alive = true, wake, rtc = null, lastJpeg = 0, view = { z: 1, x: 0.5, y: 0.5 };
  try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {}
  if (clip) {
    const player = document.createElement("video");
    Object.assign(player, { src: URL.createObjectURL(clip), loop: true, muted: true, playsInline: true });
    try { await player.play(); stream = player.captureStream ? player.captureStream() : player.mozCaptureStream(); }
    catch (e) { toast("Couldn't play that video here (try Chrome)"); return render(); }
    clip.player = player;   // keep it playing
    window.__fsClipPlayer = player;   // (tests pause it to stand in for a background tab)
    // Chrome pauses a video in a tab you've switched away from, which froze the stream: read the recording into
    // memory once (about 6 s), then play it from there, which nothing pauses
    const st = document.getElementById("st"); if (st) st.textContent = "getting the recording ready";
    clipFrames = await bakeClip(player).catch(() => null);
    clipT0 = performance.now();
    stream = player.captureStream ? player.captureStream() : player.mozCaptureStream();   // the first one ended with the read-through
  }
  else try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } }, audio: false }); }
  catch (e) { toast("Couldn't open the camera"); return render(); }
  const v = document.getElementById("v"); v.srcObject = stream;
  const c = document.createElement("canvas"); c.width = c.height = 480; const g = c.getContext("2d");
  const connect = () => {
    if (rtc) rtc.stop();
    ws = new WebSocket(RELAY.replace("https", "wss") + `/c/${channel}/send?k=${key}`);
    rtc = FSRtc.serve({ ws, relay: RELAY, channel, canvas: c, fps: 15 });
    ws.onopen = () => { const beat = setInterval(() => ws.readyState === 1 ? ws.send("ping") : clearInterval(beat), 20e3); };
    ws.onmessage = (e) => { if (e.data === "pong") return; try { const m = JSON.parse(e.data); if (rtc && rtc.message(m)) return; viewers = m.viewers ?? viewers; jpeg = m.jpeg ?? viewers; if (m.view) view = m.view; } catch (er) {} };
    ws.onclose = () => { if (alive) setTimeout(connect, 2000); };
  };
  connect();
  // the clock runs in a worker: Chrome slows timers on a page in the background to once a second (once a
  // minute after a while), which would freeze the video when this window isn't in front
  // frames straight from the camera track: Chrome stops updating a <video> in a hidden tab, which froze the
  // stream as soon as you switched away from this page. The <video> stays as the preview (and the fallback).
  let frame = null, reading = true;
  if (window.MediaStreamTrackProcessor && !clipFrames && stream.getVideoTracks()[0]) {
    const reader = new MediaStreamTrackProcessor({ track: stream.getVideoTracks()[0] }).readable.getReader();
    (async () => { while (reading) { const { value, done } = await reader.read(); if (done) break; const old = frame; frame = value; if (old) old.close(); } if (frame) frame.close(); })().catch(() => {});
  }
  const src = () => clipFrames && clipFrames.length ? { img: clipFrames[Math.floor((performance.now() - clipT0) / (1000 / CLIP_FPS)) % clipFrames.length], w: CLIP_SIDE, h: CLIP_SIDE }
    : frame ? { img: frame, w: frame.displayWidth, h: frame.displayHeight } : { img: v, w: v.videoWidth, h: v.videoHeight };
  const ticker = new Worker(URL.createObjectURL(new Blob(["setInterval(() => postMessage(0), 1000 / 15)"], { type: "text/javascript" })));
  timer = { stop: () => ticker.terminate() };
  ticker.onmessage = () => {
    const st = document.getElementById("st"), onVideo = rtc ? rtc.count() : 0;
    if (st) st.innerHTML = (viewers ? `<b></b>live to ${viewers}${onVideo ? ` (${onVideo} on video)` : ""}` : "ready, nobody watching") + (view.z > 1 ? ` · ${view.z}× zoom` : "");
    const f = src();
    if (!ws || ws.readyState !== 1 || !viewers || !f.w) return;
    // the full picture is the centre square; the view crops into it (digital zoom, from full resolution)
    const s = Math.min(f.w, f.h), cs = s / view.z;
    const sx = (f.w - s) / 2 + view.x * s - cs / 2, sy = (f.h - s) / 2 + view.y * s - cs / 2;
    g.drawImage(f.img, sx, sy, cs, cs, 0, 0, 480, 480);   // the video track is this canvas, so it's drawn 15 times a second
    // pictures only for watchers not on video, at most 10 a second, and skipped when the uplink is behind
    if (!jpeg || Date.now() - lastJpeg < 95 || ws.bufferedAmount > 24 * 1024) return;
    lastJpeg = Date.now();
    c.toBlob((b) => b && ws.readyState === 1 && ws.send(b), "image/jpeg", 0.65);
  };
  // hay and bowls: a minute after starting, then every two hours (not for a recording)
  const levelShot = () => { const f = src(); if (!f.w) return null; const sq = Math.min(f.w, f.h), lc = document.createElement("canvas"); lc.width = lc.height = 768;
    lc.getContext("2d").drawImage(f.img, (f.w - sq) / 2, (f.h - sq) / 2, sq, sq, 0, 0, 768, 768); return lc.toDataURL("image/jpeg", 0.8); };
  const checkLevels = () => { const image = levelShot(); if (image) api("/api/levels", { image }).catch(() => {}); };
  // Keeps his diary: with two cams on one pen, only one should log his poses, time on the move and hay checks,
  // or everything counts twice. On by default for the household's only (or first) cam; both still stream.
  let levelsFirst = 0, levelsEvery = 0, watch = 0;
  const others = me.cams.filter((x) => x.channel !== channel).length;
  let keepDiary = !clip && (store.get("fs.camDiary") !== null ? store.get("fs.camDiary") === "1" : others === 0);
  const startDiary = () => {
    levelsFirst = setTimeout(checkLevels, 60e3); levelsEvery = setInterval(checkLevels, 2 * 36e5);
    watch = watchActivity(v, c, g, () => view, (txt) => { const el = document.getElementById("act"); if (el) el.textContent = txt; });
  };
  const stopDiary = () => { clearTimeout(levelsFirst); clearInterval(levelsEvery); clearInterval(watch); levelsFirst = levelsEvery = watch = 0; };
  const showDiary = () => {
    const b = document.getElementById("diaryToggle"), a = document.getElementById("act");
    if (b) b.textContent = keepDiary ? "Keeps his diary: on" : "Keeps his diary: off (another cam does)";
    if (a && !keepDiary) a.textContent = "Streaming only: another cam keeps his diary";
  };
  if (keepDiary) startDiary();
  showDiary();
  if (document.getElementById("diaryToggle")) document.getElementById("diaryToggle").onclick = () => {
    keepDiary = !keepDiary; store.set("fs.camDiary", keepDiary ? "1" : "0");
    if (keepDiary) startDiary(); else stopDiary();
    showDiary(); toast(keepDiary ? "This cam keeps his diary" : "Streaming only");
  };
  camStop = () => { alive = false; reading = false; stopDiary(); if (clipFrames) clipFrames.forEach((b) => b.close()); timer.stop(); rtc && rtc.stop(); ws && ws.close(); stream.getTracks().forEach((t) => t.stop()); wake && wake.release(); };
  document.getElementById("stop").onclick = () => { store.set("fs.camOn", null); stopCam(); render(); };
}

// What a check found, drawn on its diary photo (from the Quest, which sends the boxes rather than drawing them):
// a ring round each thing in its colour, and a numbered dot (room) or a label (food, an answer). Swaps the img's
// src for the drawn picture, so the enlarged view shows it too.
const MARK = { high: "#FF4D5E", toxic: "#FF4D5E", vet: "#FF4D5E", medium: "#FFB627", caution: "#FFB627", low: "#2FA8F5", safe: "#3DBE6B", answer: "#9B6CF0" };
// draw marks on a picture (a data URL, or a diary image the hub serves with CORS) -> a JPEG data URL
function drawMarks(src, marks) {
  return new Promise((ok) => {
    const i = new Image(); i.crossOrigin = "anonymous";
    i.onload = () => {
      const c = document.createElement("canvas"); c.width = i.width; c.height = i.height; const g = c.getContext("2d"); g.drawImage(i, 0, 0);
      const lw = Math.max(3, i.width / 200); g.lineWidth = lw; g.textBaseline = "middle";
      for (const m of marks) {
        if (!Array.isArray(m.b) || m.b.length !== 4) continue;
        const [x0, y0, x1, y1] = m.b.map((n, k) => n / 1000 * (k % 2 ? i.height : i.width)), col = MARK[m.v] || "#2FA8F5", cx = (x0 + x1) / 2;
        g.strokeStyle = "#fff"; g.lineWidth = lw * 2.2; g.beginPath(); g.roundRect(x0, y0, x1 - x0, y1 - y0, lw * 4); g.stroke();
        g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.roundRect(x0, y0, x1 - x0, y1 - y0, lw * 4); g.stroke();
        const ty = Math.max(lw * 6, y0 - lw * 1.5);
        if (m.n) {
          g.fillStyle = col; g.beginPath(); g.arc(cx, ty, lw * 5, 0, Math.PI * 2); g.fill();
          g.font = `900 ${Math.round(lw * 6.5)}px Nunito, sans-serif`; g.textAlign = "center"; g.fillStyle = "#fff"; g.fillText(String(m.n), cx, ty + lw * 0.3);
        } else if (m.t) {
          g.font = `900 ${Math.round(lw * 5.5)}px Nunito, sans-serif`; g.textAlign = "left";
          const tw = g.measureText(m.t).width, pw = tw + lw * 6, ph = lw * 9, px = Math.min(Math.max(0, cx - pw / 2), i.width - pw), py = Math.max(0, ty - ph / 2);
          g.fillStyle = col; g.beginPath(); g.roundRect(px, py, pw, ph, ph / 2); g.fill();
          g.fillStyle = "#fff"; g.fillText(m.t, px + lw * 3, py + ph / 2 + lw * 0.3);
        }
      }
      try { ok(c.toDataURL("image/jpeg", 0.88)); } catch (e) { ok(src); }
    };
    i.onerror = () => ok(src);
    i.src = src;
  });
}
async function markUp(im) {
  let marks; try { marks = JSON.parse(im.dataset.marks); } catch (e) { return; }
  delete im.dataset.marks;
  im.src = await drawMarks(im.src, marks);
}

// Food check from the phone, the same as the glasses and Quest: one photo to /api/food (Muse Spark, then the
// species safety list has the last word), the foods boxed on the picture, the verdict, how much, when he last had
// it, and "We fed him this" to put the next OK day on the calendar. Saved to the diary with its marks.
const VWORD = { safe: "Safe", caution: "Small treat only", toxic: "Don't" };
async function foodCheck(photo) {
  const $o = document.getElementById("foodOut"), p = me.pets[0], name = p.name;
  if (!$o) return;
  $o.innerHTML = `<div class="card center stack pop">${bean("thinking", 80)}<p class="muted">Checking with Muse Spark…</p></div>`;
  try {
    const r = await api("/api/food", { image: photo, pet: { name, species: p.species, breed: p.breed, notes: p.notes }, tz: -new Date().getTimezoneOffset() });
    const items = (r.items || []).filter((it) => Array.isArray(it.box) && it.box.length === 4);
    if (!items.length) { $o.innerHTML = `<div class="card stack pop"><h3>No food seen</h3><p class="muted">Hold it up close, in good light, and try again.</p></div>`; return; }
    const held = items[r.held] || items[0];
    const marks = items.map((it) => ({ b: it.box, v: it.verdict, t: cap(it.food) + ": " + (VWORD[it.verdict] || it.verdict) }));
    const pic = await drawMarks(photo, marks), v = held.verdict;
    const fed = held.fed && held.fed.said ? `<p style="margin:0;color:${held.fed.wait_left > 0 ? "var(--sun-lip)" : "var(--muted)"}">${esc(held.fed.said)}</p>` : "";
    const more = v === "caution" && held.portion && held.portion !== "none" ? `<p style="margin:0"><b>How much:</b> ${esc(held.portion)}</p>` : v === "toxic" && held.instead ? `<p style="margin:0"><b>Instead:</b> ${esc(held.instead)}</p>` : "";
    const others = items.filter((it) => it !== held).map((it) => `<div class="hz"><i class="v-${it.verdict}"></i><div><b>${esc(cap(it.food))}</b> <span class="t-${it.verdict}">${VWORD[it.verdict] || ""}</span><br><span class="muted">${esc(it.reason || "")}</span></div></div>`).join("");
    $o.innerHTML = `<div class="card stack pop"><img src="${pic}" alt="${esc(cap(held.food))}, ${VWORD[v] || v}" style="width:100%;border-radius:14px;cursor:zoom-in" id="foodPic">
      <div class="row" style="gap:12px;align-items:center"><div class="badge v-${v}" style="flex:none;display:grid;place-items:center;color:#fff;font:900 22px Nunito,sans-serif">${{ safe: "✓", caution: "!", toxic: "✕" }[v] || "?"}</div><div style="min-width:0"><h2 style="margin:0">${esc(cap(held.food))}</h2><div class="vword t-${v}">${VWORD[v] || v}</div></div></div>
      <p class="muted" style="margin:0">${esc(held.reason || "")}</p>${more}${fed}${others}
      ${v !== "toxic" ? `<button class="btn" id="fedIt">We fed ${esc(name)} this</button>` : ""}</div>`;
    document.getElementById("foodPic").onclick = () => enlarge(pic, false);
    const $f = document.getElementById("fedIt");
    if ($f) $f.onclick = async () => {
      $f.disabled = true; $f.textContent = "Marking…";
      try {
        const f = await api("/api/fed", { food: held.food, verdict: v, wait_days: Number.isInteger(held.wait_days) ? held.wait_days : 3, tz: -new Date().getTimezoneOffset() });
        $f.textContent = f.next ? "OK again " + new Date(f.next + "T12:00").toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) : "Marked";
      } catch (e) { $f.disabled = false; $f.textContent = `We fed ${name} this`; toast(e.message); }
    };
    hub("/diary", { method: "POST", body: JSON.stringify({ kind: "food", title: cap(held.food), note: held.reason || "", verdict: v, image: photo, pet: name, extra: { marks } }) }).catch(() => {});
  } catch (e) { $o.innerHTML = `<div class="card stack pop"><h3>Couldn't check</h3><p class="muted">${esc(e.message)}</p></div>`; }
}

// Room check: Muse Spark lists what matters, SAM outlines each; numbered rings on the picture, a list below
async function roomCheck(req) {
  const $o = document.getElementById("roomOut"), name = me.pets[0].name;
  $o.innerHTML = `<div class="center stack">${bean("thinking", 80)}<p class="muted">Looking around the room…</p></div>`;
  try {
    const r = await api("/api/room", req), src = req.image || r.image;
    const colour = { high: "#FF4D5E", medium: "#FFB627", low: "#2FA8F5" }, icon = { chew: "Chew", toxic: "Toxic", cable: "Cable", swallow: "Swallow", stuck: "Stuck", stain: "Pee spot" };
    const pic = await new Promise((ok) => { const i = new Image(); i.onload = () => {
      const c = document.createElement("canvas"); c.width = i.width; c.height = i.height; const g = c.getContext("2d"); g.drawImage(i, 0, 0);
      const lw = Math.max(3, i.width / 220); g.lineWidth = lw; g.font = `900 ${Math.round(lw * 7)}px Nunito, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
      r.hazards.forEach((h, n) => { g.strokeStyle = colour[h.risk]; for (const b of h.boxes) {
        const cx = (b.x0 + b.x1) / 2 * i.width, cy = (b.y0 + b.y1) / 2 * i.height;
        g.beginPath(); g.ellipse(cx, cy, (b.x1 - b.x0) / 2 * i.width + lw * 2, (b.y1 - b.y0) / 2 * i.height + lw * 2, 0, 0, Math.PI * 2); g.stroke();
        g.fillStyle = colour[h.risk]; g.beginPath(); g.arc(cx, (b.y0 * i.height) - lw * 2, lw * 5, 0, Math.PI * 2); g.fill(); g.fillStyle = "#fff"; g.fillText(String(n + 1), cx, (b.y0 * i.height) - lw * 2);
      } }); ok(c.toDataURL("image/jpeg", 0.85)); }; i.src = src; });
    $o.innerHTML = `<img src="${pic}" alt="Room with ${r.hazards.length} things ringed" style="width:100%;border-radius:14px">
      ${r.hazards.map((h, n) => `<div class="hz"><i style="background:${colour[h.risk]}">${n + 1}</i><div><b>${esc(h.label)}</b> <span class="chip">${icon[h.kind] || h.kind}</span><br><span class="muted">${esc(h.why)}</span><br><span>Fix: ${esc(h.fix)}</span></div></div>`).join("")}`;
    hub("/diary", { method: "POST", body: JSON.stringify({ kind: "room", title: `Room check: ${r.hazards.length} things to sort`, note: r.hazards.slice(0, 5).map((h) => h.label).join(", "), image: pic, pet: name, extra: { hazards: r.hazards.map((h) => ({ label: h.label, kind: h.kind, risk: h.risk, fix: h.fix })) } }) }).catch(() => {});
  } catch (e) { $o.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}

// The pet cam keeps a diary of his day, cheaply. Movement is spotted here for free (tiny frames compared second
// by second). Only when the picture has been still for two minutes does it ask the AI what he's doing, once; that
// pose covers the whole still spell, logged when he gets up. Flops and big stretches are kept as moments with a
// photo (at most one an hour); chewing something that isn't food is logged as a warning straight away.
function watchActivity(v, c, g, view, status) {
  const tiny = document.createElement("canvas"); tiny.width = tiny.height = 48;
  const tg = tiny.getContext("2d", { willReadFrequently: true });
  const p = me.pets[0];
  let prev = null, lastMove = Date.now(), moveRun = 0, seg = null, asking = false, activeMs = 0, activeFrom = Date.now(), lastTick = Date.now(), lastMoment = 0;
  const post = (b) => hub("/diary", { method: "POST", body: JSON.stringify({ pet: p.name, ...b }) }).catch(() => {});
  // what he's doing right now, for the live sticker on every device (only when it changes, at most once a minute)
  let liveSent = "", liveAt = 0;
  const live = (st) => { if (st === liveSent && Date.now() - liveAt < 10 * 60e3) return; if (st !== liveSent || Date.now() - liveAt > 60e3) { liveSent = st; liveAt = Date.now(); hub("/live", { method: "PUT", body: JSON.stringify({ state: st, cam: store.get("fs.camName") || "" }) }).catch(() => {}); } };
  const snap = () => {
    const s = Math.min(v.videoWidth, v.videoHeight), vw = view(), cs = s / vw.z;
    g.drawImage(v, (v.videoWidth - s) / 2 + vw.x * s - cs / 2, (v.videoHeight - s) / 2 + vw.y * s - cs / 2, cs, cs, 0, 0, 480, 480);
    return c.toDataURL("image/jpeg", 0.8);
  };
  const close = (to) => {
    const mins = (to - seg.from) / 60e3;
    if (seg.pose && mins >= 2) post({ kind: "pose", title: FSActivity.WORD[seg.pose] || seg.pose, extra: { pose: seg.pose, mins: Math.round(mins), from: seg.from, to } });
    seg = null;
  };
  async function ask(from) {
    asking = true;
    try {
      const image = snap();
      const r = await api("/api/pose", { image });
      seg = { pose: r.visible && r.pose !== "other" ? r.pose : null, from };
      live(!r.visible ? "away" : seg.pose === "chewing" ? "eating" : seg.pose || "sitting");
      status(r.visible ? `${r.caption || FSActivity.WORD[r.pose]}` : `Still, but ${p.name} isn't in view`);
      if (r.visible && (r.pose === "flop" || r.pose === "stretched") && Date.now() - lastMoment > 3600e3) {
        lastMoment = Date.now();
        // a cut-out sticker of him if SAM can find him, else the photo
        const sticker = await makeSticker(image, api).catch(() => null);
        post({ kind: "moment", title: r.caption || `${p.name} is ${r.pose === "flop" ? "having a big flop" : "stretched out and comfy"}`, image: sticker || image, extra: { pose: r.pose, sticker: !!sticker } });
      }
      if (r.visible && r.pose === "chewing") post({ kind: "warning", title: `Chewing ${r.chewing_what || "something"}`, note: `The pet cam saw ${p.name} chewing ${r.chewing_what || "something that isn't food"}.`, verdict: "caution", image });
    } catch (e) { seg = { pose: null, from }; }
    asking = false;
  }
  return setInterval(() => {
    if (!v.videoWidth) return;
    tg.drawImage(v, 0, 0, 48, 48);
    const d = tg.getImageData(0, 0, 48, 48).data;
    let diff = 0;
    if (prev) for (let i = 0; i < d.length; i += 4) diff += Math.abs(d[i] + d[i + 1] + d[i + 2] - prev[i] - prev[i + 1] - prev[i + 2]) / 3;
    prev = d.slice();
    const now = Date.now(), dt = now - lastTick, moving = diff / (48 * 48) > 4;
    lastTick = now;
    if (moving) { moveRun++; activeMs += dt; } else moveRun = 0;
    if (moveRun >= 3) { if (seg) close(lastMove); lastMove = now; status(`${p.name} is on the move`); live("active"); }
    else if (seg && !moving) live(seg.pose ? (seg.pose === "chewing" ? "eating" : seg.pose) : "away");   // still settled: keep it fresh
    else if (moving) lastMove = now;
    if (!seg && !asking && now - lastMove > 120e3) ask(lastMove);
    if (seg && now - seg.from > 45 * 60e3) { const from = now; close(now); ask(from); }   // a long rest: look again
    if (now - activeFrom > 30 * 60e3) {
      if (activeMs > 60e3) post({ kind: "active", title: "On the move", extra: { mins: Math.round(activeMs / 60e3) } });
      post({ kind: "camtime", title: "", extra: { mins: Math.round((now - activeFrom) / 60e3) } });   // the cam was on: "not seen" then means out of view
      activeMs = 0; activeFrom = now;
    }
  }, 1000);
}

render();
</script>
</body>
