<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FurSight Wrapped</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<style>
  :root { --ink: #2B2A33; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #16151B; font-family: Nunito, system-ui, sans-serif; font-weight: 800; color: #fff; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; overflow: hidden; }
  .bars { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 4px; z-index: 5; }
  .bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
  .bars i b { display: block; height: 100%; width: 0; background: #fff; }
  .close { position: absolute; top: calc(22px + env(safe-area-inset-top)); right: 14px; z-index: 6; background: none; border: 0; color: #fff; font: 900 28px Nunito, sans-serif; cursor: pointer; }
  .slide { position: absolute; inset: 0; padding: calc(70px + env(safe-area-inset-top)) 28px calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; justify-content: center; gap: 14px; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .slide.on { opacity: 1; }
  .slide .k { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .slide h1 { font-size: clamp(34px, 9vw, 46px); font-weight: 900; line-height: 1.05; }
  .slide .big { font-size: clamp(76px, 24vw, 120px); font-weight: 900; line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .slide p { font-size: 20px; line-height: 1.3; opacity: .95; max-width: 26ch; }
  .slide .pop { animation: pop .6s cubic-bezier(.3,1.6,.5,1) both; }
  .slide.on .rise { animation: rise .6s cubic-bezier(.2,.9,.3,1) both; }
  .slide.on .rise:nth-child(2) { animation-delay: .12s } .slide.on .rise:nth-child(3) { animation-delay: .24s } .slide.on .rise:nth-child(4) { animation-delay: .36s } .slide.on .rise:nth-child(5) { animation-delay: .48s }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
  .blob { position: absolute; border-radius: 50%; opacity: .3; }
  .inapp .close { display: none; }   /* the iPhone app has its own close button */
  .sticker { width: min(78vw, 340px); align-self: center; transform: rotate(-5deg); filter: drop-shadow(0 10px 18px rgba(0,0,0,.25)); }
  .list { display: grid; gap: 10px; font-size: 22px; }
  .list div { display: flex; gap: 14px; align-items: baseline; } .list b { font-size: 30px; font-weight: 900; min-width: 1.4em; }
  .summary { background: #fff; color: var(--ink); border-radius: 26px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 8px 0 rgba(0,0,0,.18); }
  .summary .g { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; }
  .summary .g div b { display: block; font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; } .summary .g div span { font-size: 13px; color: #6B6977; }
  .center { text-align: center; align-items: center; }
  .hint { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 13px; opacity: .7; }
  .tapL, .tapR { position: absolute; top: 0; bottom: 0; z-index: 4; } .tapL { left: 0; width: 30%; } .tapR { right: 0; width: 70%; }
  @media (prefers-reduced-motion: reduce) { .slide .pop, .slide.on .rise { animation: none; } }
</style>
</head>
<body>
<script>if (new URLSearchParams(location.search).has("app")) document.body.classList.add("inapp");</script>
<div id="stage"><div class="bars" id="bars"></div><button class="close" id="close" aria-label="Close">×</button><div id="slides"></div><div class="tapL" id="tapL"></div><div class="tapR" id="tapR"></div></div>
<script src="/bean.js"></script>
<script src="/calendar.js"></script>
<script src="/tray.js"></script>
<script src="/activity.js"></script>
<script src="/routines.js"></script>
<script>
// Xiaosi's week, wrapped: his week as full-screen story slides, made only from what FurSight actually logged.
// A slide with nothing behind it is left out. Opened from the web app and the iPhone app (signed in as that device).
const HUB = "https://fursight-cam.wibble-crossplay.workers.dev";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const hashT = /^#t=(fs1\.[\w.-]+)$/.exec(location.hash);   // the demo link from scripts/demo.js
if (hashT) { store.set("fs.token", hashT[1]); history.replaceState(null, "", location.pathname + location.search); }
const token = store.get("fs.token") || store.get("fs.glassesToken");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hub = (p) => fetch(HUB + "/hub" + p, { headers: { authorization: "Bearer " + token } }).then((r) => r.json());
const img = (p) => HUB + "/hub" + p + "?t=" + encodeURIComponent(token);
const COLOURS = ["#9B6CF0", "#2FA8F5", "#3DBE6B", "#FF4D5E", "#FFB627", "#7A4ED1", "#1E86C9", "#2B2A33"];
let slides = [], at = 0, timer = 0, t0 = 0;
const DWELL = 6000;

async function build() {
  const [me, { entries }] = await Promise.all([hub("/me"), hub("/diary?limit=200")]);
  const p = me.pets[0], name = p.name, nick = String(p.nicknames || "").split(",").map((s) => s.trim()).filter(Boolean)[0];
  const since = Date.now() - 7 * 864e5, week = entries.filter((e) => e.at >= since);
  const a = FSActivity.summary(entries), days = FSActivity.days(entries, 7), tray = FSTray.summary(entries);
  const dayName = (k) => FSCal.day(k).toLocaleDateString(undefined, { weekday: "long" });
  const from = new Date(since).toLocaleDateString(undefined, { day: "numeric", month: "short" }), to = new Date().toLocaleDateString(undefined, { day: "numeric", month: "short" });
  const S = [];

  S.push({ bg: COLOURS[0], html: `<div class="k rise">${from} to ${to}</div><div class="rise" style="align-self:center">${bean("safe", 200)}</div><h1 class="rise">${esc(name)}'s week,<br>wrapped</h1><p class="rise">Here's what FurSight noticed.</p>`, cls: "center" });

  if (a.has && a.week.loaf > 0) {
    const perDay = a.week.loaf / 7;
    S.push({ bg: COLOURS[1], html: `<div class="k rise">Professional loafer</div><h1 class="rise">${esc(nick || name)} loafed for</h1><div class="big rise" data-count="${Math.round(a.week.loaf)}" data-fmt="hm">0</div><p class="rise">That's about ${FSActivity.time(perDay)} a day, tucked up like a bread roll.</p><p class="rise" style="opacity:.75;font-size:14px">Out of the ${FSActivity.time(a.week.seen)} the cams saw him. The rest stays his secret.</p>` });
  }
  if (a.has && a.week.flops > 0) {
    const best = days.reduce((m, d) => (d.flops > m.flops ? d : m), days[0]);
    S.push({ bg: COLOURS[4], html: `<div class="k rise">Flop count</div><div class="big rise" data-count="${a.week.flops}">0</div><h1 class="rise">flops this week</h1>${a.week.flopsYou ? `<p class="rise" style="opacity:.75;font-size:14px">${a.week.flopsYou} spotted by you</p>` : ""}<p class="rise">${best.flops ? `His floppiest day was ${dayName(best.date)}, with ${best.flops}. A flop means he feels completely safe.` : "A flop means he feels completely safe."}</p>` });
  }
  const moment = week.find((e) => e.kind === "moment" && e.has_image);
  if (moment) S.push({ bg: COLOURS[5], html: `<div class="k rise">Moment of the week</div><img class="sticker pop" src="${img(`/diary/${moment.id}/image`)}" alt=""><h1 class="rise" style="text-align:center">${esc(moment.title)}</h1>`, cls: "center" });
  if (a.has && a.week.active > 0) S.push({ bg: COLOURS[2], html: `<div class="k rise">Zoomies</div><h1 class="rise">On the move for</h1><div class="big rise" data-count="${Math.round(a.week.active)}" data-fmt="hm">0</div><p class="rise">Exploring, hopping and the odd binky.</p>` });

  const ws = tray.week.filter((d) => d.weight_g);
  if (ws.length > 1) {
    const change = ws[ws.length - 1].weight_g - ws[0].weight_g, visits = tray.week.reduce((s, d) => s + d.visits, 0);
    const steady = Math.abs(change) <= 20;
    S.push({ bg: COLOURS[6], html: `<div class="k rise">Weigh-ins</div><h1 class="rise">${steady ? "Steady as ever at" : change < 0 ? "Down a little, to" : "Up a little, to"}</h1><div class="big rise">${(ws[ws.length - 1].weight_g / 1000).toFixed(2)}<span style="font-size:.4em"> kg</span></div><p class="rise">Weighed on every one of his ${visits} litter tray visits. ${steady ? "Exactly what we like to see." : "Worth keeping an eye on."}</p>` });
  }

  const checks = week.filter((e) => e.kind === "food");
  if (checks.length) {
    const count = {}; for (const c of checks) count[c.title] = (count[c.title] || 0) + 1;
    const top = Object.entries(count).sort((x, y) => y[1] - x[1]).slice(0, 3);
    S.push({ bg: COLOURS[3], html: `<div class="k rise">Careful owner award</div><h1 class="rise">You checked</h1><div class="big rise" data-count="${checks.length}">0</div><h1 class="rise">foods before sharing</h1><div class="list rise">${top.map(([t, n], i) => `<div><b>${i + 1}</b>${esc(t)}${n > 1 ? ` <span style="opacity:.8">×${n}</span>` : ""}</div>`).join("")}</div>` });
  }

  const groomed = week.filter((e) => e.kind === "routine-done"), cared = week.filter((e) => e.kind === "care").length;
  if (groomed.length || cared) {
    const g = {}; for (const e of groomed) g[e.title] = (g[e.title] || 0) + 1;
    S.push({ bg: COLOURS[2], html: `<div class="k rise">Good care</div><h1 class="rise">You looked after him</h1><div class="list rise">${cared ? `<div><b>${cared}</b>daily care jobs ticked</div>` : ""}${Object.entries(g).map(([t, n]) => `<div><b>${n}</b>${esc(t.toLowerCase())}</div>`).join("")}</div>` });
  }

  const asks = week.filter((e) => e.kind === "ask").length;
  S.push({ bg: COLOURS[0], html: `<div class="summary rise">
      <div style="display:flex;align-items:center;gap:12px">${bean(a.week.flops ? "safe" : "idle", 64)}<div><div style="font-size:13px;color:#6B6977;letter-spacing:.1em">${from.toUpperCase()} TO ${to.toUpperCase()}</div><div style="font-size:26px;font-weight:900">${esc(name)}'s week</div></div></div>
      <div class="g">
        ${a.has ? `<div><b>${FSActivity.time(a.week.loaf)}</b><span>loafing</span></div><div><b>${a.week.flops}</b><span>flops</span></div><div><b>${FSActivity.time(a.week.active)}</b><span>on the move</span></div>` : ""}
        ${ws.length ? `<div><b>${(ws[ws.length - 1].weight_g / 1000).toFixed(2)} kg</b><span>weight</span></div>` : ""}
        ${checks.length ? `<div><b>${checks.length}</b><span>foods checked</span></div>` : ""}
        ${asks ? `<div><b>${asks}</b><span>questions asked</span></div>` : ""}
      </div>
      <div style="font-size:13px;color:#6B6977">${wordmark()} · it notices, your vet decides${tray.simulated || a.simulated ? " · includes simulated data" : ""}</div></div>
    <p class="rise" style="text-align:center;align-self:center;font-size:15px">Screenshot to share</p>` });
  return S;
}

function show(i) {
  at = Math.max(0, Math.min(slides.length - 1, i));
  document.querySelectorAll(".slide").forEach((el, n) => el.classList.toggle("on", n === at));
  document.querySelectorAll(".bars b").forEach((b, n) => { b.style.transition = "none"; b.style.width = n < at ? "100%" : "0"; });
  const el = document.querySelectorAll(".slide")[at];
  document.body.style.background = slides[at].bg;
  // numbers count up
  for (const c of el.querySelectorAll("[data-count]")) {
    const end = Number(c.dataset.count), fmt = c.dataset.fmt, start = performance.now();
    (function tick(t) { const k = Math.min(1, (t - start) / 1100), v = end * (1 - Math.pow(1 - k, 3)); c.textContent = fmt === "hm" ? FSActivity.time(v) : Math.round(v); if (k < 1) requestAnimationFrame(tick); })(start);
  }
  // re-run the entrance
  el.querySelectorAll(".rise, .pop").forEach((r) => { r.style.animation = "none"; void r.offsetWidth; r.style.animation = ""; });
  clearTimeout(timer); t0 = performance.now();
  const bar = document.querySelectorAll(".bars b")[at];
  requestAnimationFrame(() => { bar.style.transition = `width ${DWELL}ms linear`; bar.style.width = "100%"; });
  if (at < slides.length - 1) timer = setTimeout(() => show(at + 1), DWELL);
}

(async () => {
  if (!token) { document.getElementById("slides").innerHTML = `<div class="slide on center"><h1>Open Wrapped from the FurSight app.</h1></div>`; return; }
  slides = await build();
  document.getElementById("bars").innerHTML = slides.map(() => "<i><b></b></i>").join("");
  document.getElementById("slides").innerHTML = slides.map((s, i) => `<div class="slide ${s.cls || ""}" style="background:${s.bg}">${i % 2 ? `<div class="blob" style="width:300px;height:300px;right:-90px;top:12%;background:#fff"></div>` : `<div class="blob" style="width:260px;height:260px;left:-80px;bottom:8%;background:#fff"></div>`}${s.html}</div>`).join("");
  document.getElementById("tapR").onclick = () => show(at + 1);
  document.getElementById("tapL").onclick = () => show(at - 1);
  addEventListener("keydown", (e) => { if (e.key === "ArrowRight") show(at + 1); if (e.key === "ArrowLeft") show(at - 1); if (e.key === "Escape") leave(); });
  show(0);
})();
function leave() { history.length > 1 ? history.back() : (location.href = "/"); }
document.getElementById("close").onclick = leave;
</script>
</body>
</html>
