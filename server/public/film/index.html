<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FurSight Film</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
  :root { --ink: #2B2A33; --muted: #6B6977; --grape: #9B6CF0; --grape-lip: #7A4ED1; --bg: #F6F5F9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: Nunito, system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
  #scene { position: absolute; inset: 0; transition: transform 2.2s cubic-bezier(.6,0,.2,1); }
  #scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scene svg g { transition: opacity .6s ease; }
  #dim { position: absolute; inset: 0; background: #2B2A33; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  /* the words: one line at a time, bottom centre */
  #cap { position: absolute; left: 7%; right: 7%; bottom: 5.5%; text-align: center; pointer-events: none; }
  #cap span { display: inline-block; background: #FFFFFF; color: var(--ink); font-weight: 900; font-size: clamp(16px, 2.6vw, 44px); line-height: 1.2;
              padding: .32em .8em; border-radius: 999px; box-shadow: 0 .18em 0 rgba(43,42,51,.14); opacity: 0; transform: translateY(14px) scale(.98); transition: opacity .45s ease, transform .45s cubic-bezier(.2,.9,.3,1); }
  #cap span.on { opacity: 1; transform: none; }
  #cap span.dark { background: var(--ink); color: #FFFFFF; }
  /* the title and the end card */
  #card { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; opacity: 0; transition: opacity .8s ease; }
  #card.on { opacity: 1; }
  #card h1 { margin: 0; font-size: clamp(36px, 7vw, 120px); font-weight: 900; color: var(--ink); letter-spacing: -.01em; }
  #card p { margin: .3em 0 0; font-size: clamp(16px, 2.2vw, 36px); font-weight: 800; color: var(--muted); }
  #card .dot { color: #FFB3D4; }
  #card .plate { background: #FFFFFF; padding: .5em 1.1em .6em; border-radius: .5em; box-shadow: 0 .12em 0 rgba(43,42,51,.12); }
  #card .plate p { color: var(--ink); }
  /* the kit and the price, after the story */
  #pip { position: absolute; left: 3%; top: 6%; width: 30%; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; background: #F3F0F8; box-shadow: 0 10px 0 rgba(43,42,51,.12); opacity: 0; transform: scale(.9); transition: opacity .35s ease, transform .35s ease; pointer-events: none; }
  #pip.on { opacity: 1; transform: none; }
  #pip video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: #F3F0F8; }
  .scan img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .scan img.base { filter: saturate(0) brightness(.8); }
  .scan img.top { clip-path: inset(0 0 100% 0); }
  .scan i { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #9B6CF0; box-shadow: 0 0 18px 6px rgba(155,108,240,.55); opacity: 0; }
  .on .scan img.top { animation: scanReveal 1.6s .35s ease-in-out forwards; }
  .on .scan i { animation: scanLine 1.6s .35s ease-in-out forwards; }
  @keyframes scanReveal { to { clip-path: inset(0 0 0 0); } }
  @keyframes scanLine { 0% { top: 0; opacity: 1; } 95% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
  #floaters { position: absolute; inset: 0; pointer-events: none; }
  #floaters img { position: absolute; width: 10%; filter: drop-shadow(0 8px 10px rgba(43,42,51,.22)); opacity: 0; transform: scale(.4) rotate(var(--r)); transition: opacity .4s, transform .5s cubic-bezier(.34,1.56,.64,1); }
  #floaters.on img { opacity: 1; transform: scale(1) rotate(var(--r)); animation: bob 3.2s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
  #cold { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #cold.on { opacity: 1; }
  #cold video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  #cold video.on { opacity: 1; }
  #cold .dev { position: absolute; left: 3%; bottom: 5%; font: 900 clamp(12px, 1.6vw, 28px) Nunito, sans-serif; color: #FFFFFF; background: rgba(43,42,51,.72); padding: .35em .9em; border-radius: 99px; }
  #extra { position: absolute; inset: 0; padding-bottom: 12%; background: var(--bg); opacity: 0; transition: opacity .7s ease; pointer-events: none; display: grid; place-items: center; }
  #extra.on { opacity: 1; }
  .kitrow { position: absolute; inset: 3% 3% 17% 3%; display: flex; gap: 2.5%; align-items: center; justify-content: center; }
  .kitrow img.kit { height: 100%; max-width: 66%; object-fit: contain; border-radius: 18px; }
  .kitrow figure { margin: 0; width: 30%; }
  .kitrow figure img { width: 100%; border-radius: 18px; box-shadow: 0 6px 0 rgba(43,42,51,.12); display: block; }
  .kitrow figcaption { margin-top: 4%; text-align: center; font: 800 clamp(10px, 1.2vw, 20px) Nunito, sans-serif; color: var(--muted); }
  .price { width: 88%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.4%; }
  .price h2 { grid-column: 1 / -1; margin: 0 0 1%; text-align: center; font-size: clamp(22px, 3.6vw, 60px); font-weight: 900; color: var(--ink); }
  .tier { background: #FFFFFF; border-radius: 28px; padding: 7% 8%; box-shadow: 0 6px 0 rgba(43,42,51,.10); color: var(--ink); }
  .tier.hot { outline: 5px solid var(--grape); }
  .tier b { display: block; font-size: clamp(14px, 1.7vw, 28px); font-weight: 900; }
  .tier .n { font-size: clamp(26px, 4vw, 66px); font-weight: 900; color: var(--grape-lip); margin: 4% 0 2%; }
  .tier .n small { font-size: .4em; color: var(--muted); }
  .tier p { margin: 0; font-size: clamp(11px, 1.25vw, 21px); font-weight: 800; color: var(--muted); line-height: 1.35; }
  .price .foot { grid-column: 1 / -1; text-align: center; font: 800 clamp(10px, 1.1vw, 18px) Nunito, sans-serif; color: var(--muted); }
  /* real devices, the models, what's next */
  .devs { width: 90%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.4%; }
  .devs h2, .models h2 { grid-column: 1 / -1; margin: 0 0 1%; text-align: center; font-size: clamp(20px, 3.2vw, 54px); font-weight: 900; color: var(--ink); }
  .dev { background: #FFFFFF; border-radius: 24px; overflow: hidden; box-shadow: 0 6px 0 rgba(43,42,51,.10); color: var(--ink); }
  .dev .pic { aspect-ratio: 4 / 3; background: #EDE7F7; display: grid; place-items: center; overflow: hidden; }
  .dev .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dev .pic img.stk { width: 84%; height: 84%; object-fit: contain; filter: drop-shadow(0 5px 0 rgba(43,42,51,.14)); animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4%) rotate(-2deg); } }
  .dev b { display: block; padding: 4% 6% 0; font-size: clamp(13px, 1.6vw, 26px); font-weight: 900; }
  .dev p { margin: 0; padding: 1% 6% 6%; font-size: clamp(10px, 1.15vw, 19px); font-weight: 800; color: var(--muted); }
  .dev.soon b::after { content: "concept"; margin-left: .5em; font-size: .6em; vertical-align: middle; background: #F1EEF6; color: var(--grape-lip); padding: .15em .6em; border-radius: 99px; }
  .credit { grid-column: 1 / -1; text-align: center; font: 800 clamp(9px, .9vw, 14px) Nunito, sans-serif; color: #A9A4B6; }
  .phone { width: 34%; aspect-ratio: 9 / 18; background: var(--ink); border-radius: 18%/9%; padding: 4%; }
  .phone div { width: 100%; height: 100%; background: #EDE7F7; border-radius: 14%/7%; display: grid; place-items: center; }
  .phone img { width: 86%; filter: drop-shadow(0 3px 0 rgba(43,42,51,.15)); }
  .charm { width: 46%; aspect-ratio: 1; border-radius: 28%; background: linear-gradient(160deg, #FFFFFF, #E9E1F8); border: 4px solid var(--ink); display: grid; place-items: center; position: relative; }
  .charm img { width: 70%; }
  .charm::before { content: ""; position: absolute; top: -14%; left: 50%; width: 18%; height: 18%; border: 4px solid var(--ink); border-radius: 50%; transform: translateX(-50%); }
  .models { width: 86%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2%; }
  .model { background: #FFFFFF; border-radius: 22px; padding: 7% 8%; box-shadow: 0 6px 0 rgba(43,42,51,.10); border-top: 8px solid var(--grape); }
  .model b { display: block; font-size: clamp(13px, 1.6vw, 26px); font-weight: 900; color: var(--ink); }
  .model p { margin: .5em 0 0; font-size: clamp(10px, 1.1vw, 18px); font-weight: 800; color: var(--muted); line-height: 1.35; }
  .models .foot { grid-column: 1 / -1; text-align: center; font: 800 clamp(10px, 1.1vw, 18px) Nunito, sans-serif; color: var(--muted); }
  #go { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(246,245,249,.75); cursor: pointer; }
  #go span { background: var(--grape); color: #FFFFFF; font: 900 clamp(18px, 2.6vw, 40px) Nunito, sans-serif; padding: .5em 1.2em; border-radius: 999px; box-shadow: 0 .15em 0 var(--grape-lip); }
  #hint { position: absolute; right: 14px; bottom: 10px; font: 800 12px Nunito, sans-serif; color: #B3AEC0; }
  /* placeholders for the real footage */
  .vids { width: 92%; }
  .vids h2 { margin: 0 0 2%; display: flex; align-items: center; justify-content: center; gap: .6em; font-size: clamp(18px, 2.8vw, 48px); font-weight: 900; color: var(--ink); }
  .vids .shot, .vids .secs { font: 900 clamp(9px, 1vw, 16px) Nunito, sans-serif; padding: .3em .8em; border-radius: 99px; }
  .vids .shot { color: #FFFFFF; background: var(--grape); }
  .vids .secs { color: var(--grape-lip); background: #F1EEF6; }
  .vids .row { display: grid; gap: 2%; justify-content: center; }
  .vids .row[style*="(1,"] { grid-template-columns: min(100%, 72vh * 16 / 9 * .82) !important; }
  .vid { position: relative; overflow: hidden; }
  .vid img.still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  .vid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  .vid { aspect-ratio: 16 / 9; background: #FFFFFF; border-radius: 28px; box-shadow: 0 8px 0 rgba(43,42,51,.10); display: grid; place-content: center; text-align: center; padding: 4%; }
  .vid b { font-size: clamp(18px, 3.4vw, 64px); font-weight: 900; color: #D9D4E4; letter-spacing: .02em; }
  .row[style*="(1,"] .vid b { font-size: clamp(30px, 6vw, 104px); }
  .vid p { margin: .2em 0 0; font-size: clamp(11px, 1.5vw, 26px); font-weight: 900; color: var(--ink); }
  .vid small { display: block; margin-top: .4em; font-size: clamp(9px, 1vw, 17px); font-weight: 800; color: var(--muted); }
  /* one Muse Spark call, step by step */
  .call { width: 92%; display: grid; grid-template-columns: 1fr auto 1.15fr auto 1.25fr; align-items: center; gap: 1.6%; }
  .call h2 { grid-column: 1 / -1; margin: 0 0 1.5%; text-align: center; font-size: clamp(20px, 3.2vw, 54px); font-weight: 900; color: var(--ink); }
  .call .step { background: #FFFFFF; border-radius: 24px; padding: 6%; box-shadow: 0 6px 0 rgba(43,42,51,.10); opacity: 0; transform: translateY(12px) scale(.97); transition: opacity .45s, transform .45s cubic-bezier(.2,.9,.3,1); }
  .call .on { opacity: 1; transform: none; }
  .call .tag { display: inline-block; font: 900 clamp(9px, 1vw, 16px) Nunito, sans-serif; color: #FFFFFF; background: var(--grape); padding: .25em .8em; border-radius: 99px; margin-bottom: 4%; }
  .call img { width: 100%; border-radius: 14px; display: block; }
  .call .step p { margin: 4% 0 0; font: 800 clamp(9px, 1.05vw, 17px) Nunito, sans-serif; color: var(--muted); }
  .call .arrow { font: 900 clamp(18px, 3vw, 50px) Nunito, sans-serif; color: var(--grape); opacity: 0; transition: opacity .4s; }
  .call ul { margin: 0; padding-left: 1.1em; font: 800 clamp(10px, 1.15vw, 19px) Nunito, sans-serif; color: var(--ink); line-height: 1.45; }
  .call li { opacity: 0; transition: opacity .35s; }
  .call li.on { opacity: 1; }
  .call pre { margin: 0; background: #2B2A33; color: #EDE7F7; border-radius: 14px; padding: 5% 6%; font: 700 clamp(8px, .95vw, 16px)/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; min-height: 15em; }
  .call pre i { font-style: normal; color: #FFB23F; }
  .call pre em { font-style: normal; color: #8FD3A8; }
  .call .out { grid-column: 1 / -1; justify-self: center; display: flex; align-items: center; gap: .7em; background: #FFFFFF; border-radius: 99px; padding: .45em 1.2em .45em .5em; box-shadow: 0 5px 0 var(--vl, #D9900A); opacity: 0; transform: scale(.9); transition: opacity .4s, transform .4s cubic-bezier(.2,.9,.3,1); margin-top: 1.5%; }
  .call .out.on { opacity: 1; transform: none; }
  .call .out i { width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--v, #FFB627); color: #FFFFFF; display: grid; place-items: center; font: 900 clamp(12px, 1.4vw, 24px) Nunito, sans-serif; font-style: normal; }
  .call .out span { font: 900 clamp(12px, 1.5vw, 26px) Nunito, sans-serif; color: var(--ink); }
  .call .out small { font: 800 clamp(9px, 1vw, 17px) Nunito, sans-serif; color: var(--muted); margin-left: .4em; }
  /* one model, many jobs */
  .many { width: 90%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 2.2% 3%; }
  .many h2 { grid-column: 1 / -1; margin: 0; text-align: center; font-size: clamp(20px, 3.2vw, 54px); font-weight: 900; color: var(--ink); }
  .many .job { opacity: 0; transform: translateY(12px) scale(.97); transition: opacity .45s, transform .45s cubic-bezier(.2,.9,.3,1); display: grid; grid-template-columns: 44% 1fr; gap: 4%; align-items: center; background: #FFFFFF; border-radius: 24px; padding: 3%; box-shadow: 0 6px 0 rgba(43,42,51,.10); }
  .many .job.on { opacity: 1; transform: none; }
  .many .vid { background: #F1EEF6; box-shadow: none; border-radius: 16px; padding: 6%; }
  .many .vid b { font-size: clamp(12px, 1.6vw, 28px); }
  .many .jt b { display: block; font: 900 clamp(13px, 1.7vw, 30px) Nunito, sans-serif; color: var(--ink); margin-bottom: .2em; }
  .many .chip { display: inline-block; font: 900 clamp(8px, .85vw, 14px) Nunito, sans-serif; color: #FFFFFF; background: var(--grape); padding: .2em .7em; border-radius: 99px; margin: 0 .3em .3em 0; }
  .many .chip.sam { background: var(--sky, #2EA8F5); }
  .many p { margin: .3em 0 0; font: 800 clamp(9px, 1.05vw, 18px) Nunito, sans-serif; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { #cap span, #scene svg g { transition: none; } }
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="scene"></div><div id="dim"></div><div id="card"></div><div id="pip"></div><div id="extra"></div><div id="floaters"></div><div id="cold"></div><div id="cap"><span id="capText"></span></div><div id="go"><span>▶ Play with sound</span></div></div></div>
<div id="hint"><b id="tc">0:00</b> · R or click to replay · M mutes</div>
<script>
// The FurSight film (about 3:00): the intro's story, white "VID HERE" boxes where the real footage goes, one
// Muse Spark call shown step by step, then the closing slides. The intro itself stays as it is (/intro/, tag intro-v1).
// FurSight's intro: Xiaosi's story in the kit schematic's style, with his own stickers. He had GI stasis; since
// then every treat feels like a risk; he roams, chews a cable, finds avocado (healthy for us, can be fatal for
// him). Then the kit arrives and each worry gets an answer.
// The scene (props in groups, his stickers, where he goes) comes from docs/kit-src/make_intro.py.
const $ = (id) => document.getElementById(id);
let S, run = 0;
// the story (the animated intro) runs quicker than the footage: every wait and tween in it is scaled by PACE
let PACE = 1;
const wait = (ms, r) => new Promise((ok, no) => setTimeout(() => (r === run ? ok() : no("stop")), ms * PACE));
const show = (id, on = true) => { const el = $(id); if (el) el.setAttribute("opacity", on ? "1" : "0"); };
// the camera: zoomed right in on his sticker, or the whole room
const closeUp = (on) => {
  const sc = $("scene"), [x, y] = S.spots.pen;
  if (on) { sc.style.transition = "none"; sc.style.transformOrigin = `${x / 16}% ${(y - 60) / 9}%`; sc.style.transform = "scale(3.4)"; void sc.offsetWidth; sc.style.transition = ""; }
  else sc.style.transform = "";
};
const extra = (html) => { $("extra").innerHTML = html || $("extra").innerHTML; $("extra").classList.toggle("on", !!html); };
const caption = async (text, ms, r, dark = false) => {
  const c = $("capText"); c.classList.remove("on"); await wait(220, r);
  c.textContent = text; c.classList.toggle("dark", dark); c.classList.add("on"); await wait(ms, r);
};
// his real stickers (cut-outs of Xiaosi from the demo clip) floating round the edges, while the film talks stickers
const floaters = (on) => {
  const el = $("floaters");
  if (!on) { el.classList.remove("on"); return; }
  const spots = [[3, 9, -10, 0], [87, 7, 9, .5], [2, 66, 7, 1], [88, 64, -8, 1.5]];
  const files = ["xiaosi-sticker.png", "xiaosi-sticker-2.png", "xiaosi-sticker-3.png", "xiaosi-sticker-4.png"];
  el.innerHTML = spots.map(([x, y, r, d], i) => `<img src="/demo/${files[i]}" alt="" style="left:${x}%;top:${y}%;--r:${r}deg;--d:${d}s;transition-delay:${i * .12}s">`).join("");
  void el.offsetWidth; el.classList.add("on");
};
// the real thing, small and to the side while the story says it (a clip from film/clips; hidden if it's missing)
const pip = (clip, from = 0) => {
  const el = $("pip");
  if (!clip) { el.classList.remove("on"); return; }
  el.innerHTML = `<video src="clips/${clip}#t=${from}" muted autoplay playsinline></video>`;
  el.querySelector("video").onerror = () => el.classList.remove("on");
  el.classList.add("on");
};
const card = (html) => { $("card").innerHTML = html; $("card").classList.toggle("on", !!html); };

// ---------------------------------------------------------------- sound: ElevenLabs effects (docs/kit-src/make_sfx.mjs)
const AC = new (window.AudioContext || window.webkitAudioContext)(), master = AC.createGain(); master.connect(AC.destination);
const buf = {}, NAMES = ["pop", "hop", "chew", "munch", "sting", "warn", "chime", "click", "whoosh", "ping", "title", "end", "bed"];
NAMES.forEach((n) => fetch(`/intro/sfx/${n}.mp3`).then((x) => x.arrayBuffer()).then((a) => AC.decodeAudioData(a)).then((b) => (buf[n] = b)).catch(() => {}));
let bed = null;
function sfx(n, vol = 0.7, loop = false) {
  if (!buf[n]) return null;
  const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = buf[n]; src.loop = loop; g.gain.value = vol;
  src.connect(g).connect(master); src.start(); return { src, g };
}
function music(on) {
  if (bed) { const b = bed; b.g.gain.setTargetAtTime(0, AC.currentTime, .4); setTimeout(() => b.src.stop(), 2000); bed = null; }
  if (on) bed = sfx("bed", 0.16, true);
}

// ---------------------------------------------------------------- Xiaosi: one sticker, moved and posed
let bun = { x: 0, y: 0, face: 1, pose: "side", lift: 0, tilt: 0, sx: 1, sy: 1, size: 1 };
function draw() {
  const st = S.stickers[bun.pose], k = 0.62 * bun.size, w = st.w * k, h = st.h * k;
  const img = $("bun");
  if (img.getAttribute("href") !== st.src) { img.setAttribute("href", st.src); img.setAttributeNS("http://www.w3.org/1999/xlink", "href", st.src); }
  img.setAttribute("width", w); img.setAttribute("height", h); img.setAttribute("x", -w / 2); img.setAttribute("y", -h + 6);
  img.setAttribute("transform", `translate(0 ${-bun.lift}) rotate(${bun.tilt}) scale(${bun.face * bun.sx} ${bun.sy})`);
  $("bunshadow").setAttribute("rx", 34 * bun.size * (1 - bun.lift / 120)); $("bunshadow").setAttribute("opacity", 0.14 * (1 - bun.lift / 90));
  $("bunwrap").setAttribute("transform", `translate(${bun.x} ${bun.y})`);
}
const tween = (ms, r, step) => new Promise((ok, no) => {
  const t0 = performance.now(); ms *= PACE;
  (function f(t) { if (r !== run) return no("stop"); const k = Math.min(1, (t - t0) / ms); step(k); draw(); k < 1 ? requestAnimationFrame(f) : ok(); })(t0);
});
// hop to a spot: little arcs, squash on landing, facing the way he's going
async function hop(spot, ms, r, hops = 3) {
  const [x0, y0] = [bun.x, bun.y], [x1, y1] = S.spots[spot];
  bun.face = x1 < x0 ? -1 : 1;
  let landed = 0;
  await tween(ms, r, (k) => {
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, ph = (k * hops) % 1;
    if (Math.floor(k * hops + .5) > landed) { landed++; sfx("hop", 1.4); }
    bun.x = x0 + (x1 - x0) * e; bun.y = y0 + (y1 - y0) * e;
    bun.lift = Math.sin(ph * Math.PI) * 26; bun.sy = ph < .12 || ph > .9 ? .9 : 1.04; bun.sx = 2 - bun.sy;
  });
  bun.lift = 0; bun.sx = bun.sy = 1;
}
const breathe = (ms, r) => tween(ms, r, (k) => { const s = Math.sin(k * Math.PI * 2 * ms / 1800); bun.sy = 1 - s * .025; bun.sx = 1 + s * .02; });
const nod = (ms, r) => tween(ms, r, (k) => { bun.tilt = Math.max(0, Math.sin(k * Math.PI * 2 * ms / 500)) * 9 * bun.face; });
const chew = (ms, r) => tween(ms, r, (k) => { bun.tilt = Math.sin(k * Math.PI * 2 * ms / 160) * 3; bun.sy = 1 + Math.sin(k * Math.PI * 2 * ms / 160) * .02; });
// turn to look at something (the stickers face right as drawn)
const faceTo = (t) => { bun.face = S.targets[t][0] < bun.x ? -1 : 1; draw(); };
const pose = (p, face = 1) => { bun.pose = p; bun.face = face; draw(); };
const pop = (r) => tween(450, r, (k) => { bun.size = k < .7 ? (k / .7) * 1.08 : 1.08 - (k - .7) / .3 * .08; });

function coldLoad() {
  const el = $("cold");
  if (el.querySelector("video")) return;
  el.innerHTML = COLD.map(([f, from]) => `<video src="clips/${f}#t=${from}" muted playsinline preload="auto"></video>`).join("") + `<div class="dev" id="coldDev"></div>`;
}
async function coldOpen(r) {
  const el = $("cold");
  coldLoad();
  const vids = [...el.querySelectorAll("video")];
  // only when the clips are there (they live on this Mac, not on the site)
  const ready = (v) => v.readyState >= 2 ? Promise.resolve(true) : new Promise((res) => { v.addEventListener("loadeddata", () => res(true), { once: true }); v.addEventListener("error", () => res(false), { once: true }); });
  const ok = await Promise.race([Promise.all(vids.map(ready)), wait(6000, r).then(() => [false])]);
  if (!ok.every(Boolean)) { el.innerHTML = ""; return; }
  el.classList.add("on");
  for (let i = 0; i < COLD.length; i++) {
    const v = vids[i]; v.currentTime = COLD[i][1]; v.play().catch(() => {});
    vids.forEach((x, k) => x.classList.toggle("on", k === i)); $("coldDev").textContent = COLD[i][3];
    sfx("whoosh", .35);
    await wait(COLD[i][2] * 1000, r);
  }

}

    ["Meta Quest: make your own stickers", [["Meta Quest", "Pinch to take a photo of Xiaosi; the polaroid, then his sticker pops onto its corner"]], 6000, "Snap a photo of him to make your own stickers. Your hands stay in front of it all, with depth occlusion.", null, true],
    ["Meta Quest: the poo check", [["Meta Quest", "Today's to-dos pop up; press Poo check now, look at a few of his droppings: a dot on each one, and the card compares with last time"]], 6000, "Today's to-dos pop up. The poo check puts a dot on every dropping, and compares with last time."],
    ["His week, wrapped", [["Meta Quest", "Open His week; swipe through Wrapped with your hand, stickers popping out, then his week card", "4-quest-his-week-9s.mp4"], ["Phone", "His week, wrapped, on the phone: the same story, slide by slide", "12-phone-wrapped-tall.mp4", false, true]], 9000, "His week, wrapped, on Quest and your phone. Swipe through it with your hand.", "2fr .62fr"],
    ["Phone: a sticker alert", [["Phone", "A notification with his sticker when he flops", "9-phone-flop-alert.mp4"]], 7000, "Scrolling Instagram? When he flops, you get his sticker.", null, true],
    ["The app: diary and stats", [["Web app", "Scroll the diary (marked-up check photos), then weight, tray visits, hay, his week", "7-web-diary-stats-6s.mp4"]], 6000, "It all lands in his diary: what he ate, his weight, his tray, his week."],
  ];
  const total = shots.filter((x) => Array.isArray(x)).length;
  let n = 0;
  for (const sh of shots) {
    $("capText").classList.remove("on"); sfx("whoosh", .5);
    if (!sh) { await museCall(r); continue; }

      <div class="row" style="grid-template-columns:${cols || `repeat(${boxes.length},1fr)`};align-items:center">${boxes.map(([l, f, clip, sound, tall]) => `<div class="vid" ${tall ? 'style="aspect-ratio:9/16"' : ""}><div><b>VID HERE</b><p>${l}</p><small>${f}</small></div>${!clip ? "" : /\.(jpe?g|png|webp)$/i.test(clip) ? `<img class="still" src="${clip.startsWith("/") ? clip : "clips/" + clip}" alt="" onerror="this.remove()">` : `<video src="${clip.startsWith("/") ? clip : "clips/" + clip}" ${sound ? "" : "muted"} autoplay playsinline onerror="this.remove()"></video>`}</div>`).join("")}</div></div>`);
    floaters(!!stickers);
    await wait(300, r); await caption(line, ms - 520, r);
  }
  floaters(false);
  $("capText").classList.remove("on");

  // the models

// One real Muse Spark call (a coffee, from the phone's Check), step by step: the picture that's sent, what Muse
// Spark is asked to do, the JSON that came back (3 s), then SAM 3.1's outline of the same cup, and the card.
async function museCall(r) {
  const J = `{
  "food": <i>"coffee"</i>,
  "held": <em>true</em>,
  "label": <i>"SPRINGGO COFFEE"</i>,
  "verdict": <i>"toxic"</i>,
  "reason": <i>"Caffeine can cause heart and digestive problems in rabbits."</i>,
  "instead": <i>"water and hay"</i>,
  "box": [<em>170, 0, 850, 873</em>]
}`;
  extra(`<div class="call"><h2>One check: Muse Spark, then SAM 3.1</h2>
    <div class="step" id="c1"><span class="tag" id="c1tag">1 · Sent</span><img id="c1img" src="clips/coffee-sent.jpg" alt="A coffee cup" onerror="this.onerror=null;this.src='sent.jpg'"><p id="c1p">One photo from the phone</p></div>
    <div class="arrow" id="a1">→</div>
    <div class="step" id="c2"><span class="tag">2 · Muse Spark</span><ul>
      <li>What food is it? Is it held?</li><li>Safe, a treat, or never?</li><li>How much, and what instead?</li><li>What's on the label?</li><li>A box round it in the picture</li></ul>
      <p>Checked against the rabbit safety list, which always wins. Through the Meta Model API.</p></div>
    <div class="arrow" id="a2">→</div>
    <div class="step" id="c3"><span class="tag">3 · Back in 3 s</span><pre id="json"></pre></div>
    <div class="out" id="c4" style="--v:#FF4D5E;--vl:#D93545"><i>✕</i><span>Coffee: don't</span><small>caffeine · water and hay instead</small></div></div>`);
  await wait(300, r);
  caption("One check: the picture sent, what Muse Spark is asked, and what comes back.", 3200, r).catch(() => {});
  const on = (id) => $(id) && $(id).classList.add("on"), op = (id) => $(id) && ($(id).style.opacity = 1);
  on("c1"); sfx("click", .5); await wait(500, r); op("a1"); on("c2"); sfx("click", .5);
  for (const li of document.querySelectorAll(".call li")) { await wait(220, r); li.classList.add("on"); }
  await wait(300, r); op("a2"); on("c3"); sfx("ping", .4);
  const lines = J.split("\n"), pre = $("json");
  for (let k = 1; k <= lines.length; k++) { pre.innerHTML = lines.slice(0, k).join("\n"); await wait(100, r); }
  // SAM 3.1 on the same picture: the cup's exact outline (its real mask, "cup")
  await wait(250, r);
  const im = $("c1img"); if (im && im.src.includes("coffee-sent")) { im.style.transition = "opacity .35s"; im.style.opacity = 0; await wait(350, r); im.src = "clips/coffee-sam.jpg"; im.style.opacity = 1;
    $("c1tag").textContent = "4 · SAM 3.1"; $("c1p").textContent = "Outlines the exact cup, in 2 s"; sfx("ping", .4); }
  caption("Muse Spark says what it is. SAM 3.1 outlines exactly where.", 1900, r).catch(() => {});
  await wait(1900, r); on("c4"); sfx("chime", .55);
  await caption("Then it's a card on the food, on your glasses, Quest or phone.", 2200, r);
}
