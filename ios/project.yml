# FurSight for iPhone. Generate the Xcode project with: xcodegen generate
name: FurSight
options:
  bundleIdPrefix: studio.ohi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: WF6ZP7RJJV
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FurSight:
    type: application
    platform: iOS
    sources: [FurSight]
    entitlements:
      path: FurSight/FurSight.entitlements
      properties:
        aps-environment: development
    info:
      path: FurSight/Info.plist
      properties:
        CFBundleDisplayName: FurSight
        UILaunchScreen: { UIColorName: "" }
        UIAppFonts: [Nunito-800.ttf, Nunito-900.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: FurSight uses the camera to check whether a food or plant is safe for your pet.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ohi.fursight
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
