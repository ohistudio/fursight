# FurSight for iPhone. Generate the Xcode project with: xcodegen generate
name: FurSight
options:
  bundleIdPrefix: studio.ohi
  deploymentTarget:
    iOS: "17.2"
packages:
  # Ray-Ban Display through the Device Access Toolkit. 1.0.x is what the current glasses firmware shows UI for.
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    DEVELOPMENT_TEAM: WF6ZP7RJJV
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FurSight:
    type: application
    platform: iOS
    sources: [FurSight]
    dependencies:
      - target: FurSightNotify
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
    entitlements:
      path: FurSight/FurSight.entitlements
      properties:
        aps-environment: development
        # the glasses camera streams over the glasses' own Wi-Fi, which the phone joins
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    info:
      path: FurSight/Info.plist
      properties:
        CFBundleDisplayName: FurSight
        UILaunchScreen: { UIColorName: "" }
        UIAppFonts: [Nunito-800.ttf, Nunito-900.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: FurSight uses the camera to check whether a food or plant is safe for your pet, and to add photos and videos to their record.
        NSMicrophoneUsageDescription: FurSight records sound when you film a video for your pet's record.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSBluetoothAlwaysUsageDescription: FurSight uses Bluetooth to connect to your glasses.
        NSLocalNetworkUsageDescription: FurSight connects to your glasses over Wi-Fi to use their camera.
        NSBonjourServices: [_bonjour._tcp]
        UIBackgroundModes: [processing, bluetooth-central, bluetooth-peripheral]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [fursight]
        # Meta AI hands back to fursight:// after you connect. Developer Mode needs no registered app yet, so the
        # app ID and token are placeholders (as in Lisso) until FurSight is registered in the Wearables Developer Center.
        MWDAT:
          AppLinkURLScheme: fursight://
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
          DAMEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ohi.fursight
        CODE_SIGN_STYLE: Automatic
        META_APP_ID: PLACEHOLDER_META_APP_ID
        CLIENT_TOKEN: PLACEHOLDER_CLIENT_TOKEN
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FurSightNotify:
    type: app-extension
    platform: iOS
    sources: [NotifyService]
    info:
      path: NotifyService/Info.plist
      properties:
        CFBundleDisplayName: FurSight pictures
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ohi.fursight.pictures
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
