name = "fursight-cam"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

[[durable_objects.bindings]]
name = "CHANNELS"
class_name = "Channel"

[[durable_objects.bindings]]
name = "HOUSEHOLDS"
class_name = "Household"

[[durable_objects.bindings]]
name = "LINKS"
class_name = "Links"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Channel"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Household", "Links"]

[vars]
# the Vercel server sends the Apple push notifications (it holds the APNs key)
NOTIFY_URL = "https://fursight-seven.vercel.app/api/notify"
