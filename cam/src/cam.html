<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FurSight Cam</title>
<style>
  :root { --bg: #0f1412; --card: #18201c; --line: #2a3530; --text: #eef3ef; --dim: #93a39a; --accent: #7fd6a4; --warn: #f2b75b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--dim); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  video { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #000; display: block; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button, select, input { font: inherit; color: var(--text); background: #222c27; border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; }
  button.go { background: var(--accent); color: #0b1a12; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; }
  input { flex: 1; min-width: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .stat { background: #141b17; border-radius: 10px; padding: 10px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--dim); font-size: 12px; }
  .note { color: var(--dim); font-size: 13px; margin: 10px 0 0; }
  .live { color: var(--accent); } .idle { color: var(--dim); } .bad { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>FurSight Cam</h1>
  <p class="sub">Leave this page open on the computer by the enclosure. It only sends pictures while someone is watching.</p>

  <div class="card">
    <video id="v" playsinline muted></video>
    <div class="row" style="margin-top:12px">
      <button id="start" class="go">Start camera</button>
      <select id="cams" hidden></select>
      <label class="row" style="gap:6px">FPS <select id="fps"><option>2</option><option>4</option><option selected>6</option><option>10</option></select></label>
    </div>
    <div class="stats">
      <div class="stat"><b id="sView">0</b><span>watching</span></div>
      <div class="stat"><b id="sFps">0</b><span>frames / s sent</span></div>
      <div class="stat"><b id="sKb">0</b><span>KB per frame</span></div>
    </div>
    <p class="note" id="status">Camera off.</p>
  </div>

  <div class="card">
    <div style="margin-bottom:8px">Open this on the glasses (or any browser):</div>
    <div class="row"><input id="link" readonly><button id="copy">Copy</button></div>
    <p class="note">Anyone with this link can see the camera. "New link" makes a fresh private one.</p>
    <div class="row" style="margin-top:8px"><button id="pet">Pet name</button><button id="reset">New link</button></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const rand = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789"[b % 56]).join("");
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

let channel = store.get("fs.channel"), key = store.get("fs.key"), pet = store.get("fs.pet") || "Xiaosi";
// #ch=<16>&k=<24> adopts a channel made elsewhere (so a script can open both ends), then clears the hash
const h = new URLSearchParams(location.hash.slice(1));
if (/^[A-Za-z0-9]{16}$/.test(h.get("ch") || "") && (h.get("k") || "").length >= 16) {
  channel = h.get("ch"); key = h.get("k"); store.set("fs.channel", channel); store.set("fs.key", key);
  history.replaceState(null, "", location.pathname);
}
if (!channel || !key) { channel = rand(16); key = rand(24); store.set("fs.channel", channel); store.set("fs.key", key); }
const showLink = () => { $("link").value = `${location.origin}/g/${channel}?name=${encodeURIComponent(pet)}`; };
showLink();
$("copy").onclick = () => { $("link").select(); navigator.clipboard?.writeText($("link").value); $("copy").textContent = "Copied"; setTimeout(() => ($("copy").textContent = "Copy"), 1200); };
$("pet").onclick = () => { const n = prompt("Pet's name", pet); if (n) { pet = n.trim().slice(0, 20); store.set("fs.pet", pet); showLink(); } };
$("reset").onclick = () => { channel = rand(16); key = rand(24); store.set("fs.channel", channel); store.set("fs.key", key); showLink(); if (ws) ws.close(); };

const video = $("v"), canvas = document.createElement("canvas"), SIDE = 480;
canvas.width = canvas.height = SIDE;
const ctx2d = canvas.getContext("2d");
let stream = null, ws = null, viewers = 0, sent = 0, lastKb = 0, busy = false, timer = null;

async function startCamera(deviceId) {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: deviceId ? { deviceId: { exact: deviceId }, width: 1280 } : { width: 1280 }, audio: false });
  video.srcObject = stream; await video.play();
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  const sel = $("cams"); sel.innerHTML = "";
  for (const d of devs) { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || "Camera"; sel.appendChild(o); }
  sel.value = stream.getVideoTracks()[0].getSettings().deviceId || ""; sel.hidden = devs.length < 2;
  $("start").textContent = "Camera on"; $("start").disabled = true;
  connect(); schedule();
}
$("start").onclick = () => startCamera().catch((e) => setStatus("Couldn't open the camera: " + e.message, "bad"));
$("cams").onchange = (e) => startCamera(e.target.value);
$("fps").onchange = schedule;

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/c/${channel}/send?k=${key}`);
  ws.onmessage = (e) => { try { viewers = JSON.parse(e.data).viewers ?? viewers; } catch (err) {} render(); };
  ws.onclose = (e) => { viewers = 0; render(); if (e.code === 4000) return; setTimeout(connect, 2000); };
  ws.onopen = render;
}

function schedule() {
  clearInterval(timer);
  timer = setInterval(sendFrame, 1000 / Number($("fps").value));
}

// centre square crop of the camera, so the glasses' square frame is filled
function sendFrame() {
  if (!stream || !ws || ws.readyState !== 1 || viewers === 0 || busy || ws.bufferedAmount > 24 * 1024) return; // slow uplink: skip frames rather than queue them, so the glasses stay close to live
  const w = video.videoWidth, h = video.videoHeight; if (!w) return;
  const s = Math.min(w, h);
  ctx2d.drawImage(video, (w - s) / 2, (h - s) / 2, s, s, 0, 0, SIDE, SIDE);
  busy = true;
  canvas.toBlob((b) => { busy = false; if (b && ws.readyState === 1) { ws.send(b); sent++; lastKb = Math.round(b.size / 1024); } }, "image/jpeg", 0.65);
}
setInterval(() => { $("sFps").textContent = sent; sent = 0; $("sKb").textContent = lastKb; }, 1000);

function setStatus(t, cls) { $("status").textContent = t; $("status").className = "note " + (cls || ""); }
function render() {
  $("sView").textContent = viewers;
  if (!stream) return setStatus("Camera off.");
  if (!ws || ws.readyState !== 1) return setStatus("Connecting to the relay…", "bad");
  setStatus(viewers ? `Live: sending to ${viewers} viewer${viewers > 1 ? "s" : ""}.` : "Camera ready. Waiting for someone to watch.", viewers ? "live" : "idle");
}
</script>
</body>
</html>
