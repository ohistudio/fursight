<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1">
<title>FurSight Cam</title>
<style>
  /* Ray-Ban Display: 600x600, black is see-through, edges get cropped, so everything lives in the central 420 */
  html, body { margin: 0; width: 100%; height: 100%; background: #000000; overflow: hidden; }
  body { font-family: -apple-system, system-ui, sans-serif; color: #ffffff; }
  #frame { position: absolute; left: 50%; top: 50%; width: 600px; height: 600px; transform: translate(-50%, -50%) scale(var(--fit, 1)); }
  #view { position: absolute; left: 90px; top: 110px; width: 420px; height: 380px; border-radius: 18px; overflow: hidden; background: #000000; }
  #img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #top { position: absolute; left: 90px; top: 70px; width: 420px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 600; }
  #dot { display: inline-block; width: 12px; height: 12px; border-radius: 6px; background: #5a5a5a; margin-right: 8px; vertical-align: middle; }
  #dot.live { background: #7fd6a4; }
  #state { font-size: 18px; font-weight: 500; color: #cfd8d3; }
  #bottom { position: absolute; left: 90px; top: 500px; width: 420px; text-align: center; font-size: 18px; color: #cfd8d3; }
  #wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; color: #cfd8d3; padding: 30px; }
</style>
</head>
<body>
<div id="frame">
  <div id="top"><span><span id="dot"></span><span id="name">Pet cam</span></span><span id="state">connecting</span></div>
  <div id="view"><img id="img" alt=""><div id="wait">Connecting to the camera…</div></div>
  <div id="bottom"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const channel = location.pathname.split("/")[2];
const $ = (id) => document.getElementById(id);
$("name").textContent = (q.get("name") || "Pet") + " cam";
const frame = $("frame");
if (q.get("fit")) frame.style.setProperty("--fit", q.get("fit"));
if (q.get("at")) { const [x, y] = q.get("at").split(",").map(Number); frame.style.left = `calc(50% + ${x || 0}px)`; frame.style.top = `calc(50% + ${y || 0}px)`; }

let lastFrame = 0, frames = 0, fps = 0, url = null, mode = "socket";
function show(blob) {
  const next = URL.createObjectURL(blob);
  $("img").src = next; if (url) URL.revokeObjectURL(url); url = next;
  lastFrame = Date.now(); frames++; $("wait").style.display = "none";
}
setInterval(() => {
  fps = frames; frames = 0;
  const age = (Date.now() - lastFrame) / 1000, live = lastFrame && age < 3;
  $("dot").className = live ? "live" : "";
  $("state").textContent = live ? "live" : lastFrame ? "paused" : "waiting";
  $("bottom").textContent = live ? `${fps} fps` : lastFrame ? `last picture ${age < 60 ? Math.round(age) + " s" : Math.round(age / 60) + " min"} ago` : "";
  if (!lastFrame) $("wait").textContent = "Waiting for the camera at home…";
}, 1000);

// socket first; if the glasses browser won't hold one, fetch the latest picture on a loop
function socket() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  let opened = false;
  const ws = new WebSocket(`${proto}//${location.host}/c/${channel}/watch`);
  ws.binaryType = "blob";
  const giveUp = setTimeout(() => { if (!opened) { ws.close(); poll(); } }, 4000);
  ws.onopen = () => { opened = true; clearTimeout(giveUp); };
  ws.onmessage = (e) => { if (typeof e.data !== "string") show(e.data); };
  ws.onclose = () => { clearTimeout(giveUp); if (opened && mode === "socket") setTimeout(socket, 1500); else if (!opened && mode === "socket") poll(); };
  setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 20000);
}
function poll() {
  if (mode === "poll") return; mode = "poll";
  const me = Math.random().toString(36).slice(2, 10);
  const loop = async () => {
    try {
      const r = await fetch(`/c/${channel}/frame.jpg?v=${me}&t=${Date.now()}`, { cache: "no-store" });
      if (r.status === 200 && Number(r.headers.get("x-frame-age")) < 3000) show(await r.blob());
    } catch (e) {}
    setTimeout(loop, 200);
  };
  loop();
}
socket();
</script>
</body>
</html>
